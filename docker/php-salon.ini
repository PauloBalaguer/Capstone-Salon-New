; Loaded after php.ini-production in the container.
expose_php = Off
display_errors = Off
log_errors = On

; The image never changes while it runs, so skip the file-changed checks.
opcache.validate_timestamps = 0

; Matches the 30-day "remember me" login in session.php. The shorter default
; would delete a session from the database after 24 idle minutes.
session.gc_maxlifetime = 2592000
session.gc_probability = 1
session.gc_divisor = 1000
