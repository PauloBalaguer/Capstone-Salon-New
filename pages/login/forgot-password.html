<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leo Mejillano Salon &amp; Beauty — Forgot Password</title>
  <link rel="stylesheet" href="../../assets/css/login-base.css" />
</head>
<body>

<div class="page page-stacked">
  <div class="page-dots" aria-hidden="true"></div>

  <div class="top-bar" data-auth-topbar></div>

  <div class="card">

    <a href="login.html" class="close-link" aria-label="Back to login">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Back to login
    </a>

    <span class="card-badge">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </span>

    <span class="card-eyebrow">Account recovery</span>
    <h1 class="card-title">Forgot password?</h1>
    <p class="card-text">Enter the email address you used to create your account. We'll email you a 6-digit code to reset your password.</p>

    <form id="forgot-password-form" class="form" novalidate>
      <div class="field">
        <label for="forgot-email">Email address</label>
        <div class="field-box">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <input id="forgot-email" name="email" type="email" autocomplete="email" placeholder="you@email.com">
        </div>
        <p class="field-error" id="forgot-email-error"></p>
      </div>

      <button type="submit" class="btn-main">Send reset code</button>
    </form>

    <div class="divider" aria-hidden="true">
      <span></span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2C9 7 6 9 6 13a6 6 0 0 0 12 0c0-4-3-6-6-11z"/></svg>
      <span></span>
    </div>

    <p class="card-foot">Remember your password? <a href="login.html" class="link-gold">Log in</a></p>
  </div>

  <span class="page-note" data-auth-footer></span>
</div>

<div class="loading" id="loading" aria-hidden="true"><div class="spinner"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../../scripts/login/common.js?v=2"></script>
<script src="../../scripts/login/forgot-password.js"></script>
</body>
</html>
