  <div x-show="isReviewModalOpen" x-transition.opacity
    class="fixed inset-0 z-[9998] flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4"
    style="display: none">
    <div x-show="isReviewModalOpen" x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
      @click.outside="closeReviewModal()"
      class="bg-slate-900 border border-luxury-800 rounded-2xl max-w-md w-full p-6 space-y-5">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-serif font-bold text-white"
          x-text="isEditingReview ? 'Edit Your Review' : 'Leave a Review'"></h3>
        <button @click="closeReviewModal()" class="text-slate-400 hover:text-white">
          &times;
        </button>
      </div>

      <form @submit.prevent="submitReview()" class="space-y-4 text-xs">
        <p class="text-slate-400">
          How was your experience for
          <strong class="text-white" x-text="reviewForm.serviceName"></strong>
          with
          <strong class="text-white" x-text="reviewForm.staffName"></strong>?
        </p>

        <div>
          <label class="block text-slate-400 mb-1">Rating</label>
          <div class="flex space-x-1 text-2xl text-slate-600">
            <template x-for="star in [1, 2, 3, 4, 5]" :key="star">
              <button type="button" @click="reviewForm.rating = star"
                :class="reviewForm.rating >= star ? 'text-gold-400 scale-110' : 'hover:text-gold-500'"
                class="transition-all duration-150">
                ★
              </button>
            </template>
          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1">Your Feedback (Optional)</label>
          <textarea x-model="reviewForm.comment" rows="4" placeholder="Tell us more about your experience..."
            class="w-full bg-slate-950 text-slate-200 rounded-lg p-2.5 border border-slate-800 focus:outline-none focus:ring-1 focus:ring-purple-500"></textarea>
        </div>

        <div class="pt-2 flex justify-end space-x-3 border-t border-slate-800">
          <button type="button" @click="closeReviewModal()"
            class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition">
            Cancel
          </button>
          <button type="submit"
            class="px-5 py-2 bg-gradient-to-r from-gold-500 to-gold-600 text-slate-900 font-bold rounded-lg transition active:scale-95"
            x-text="isEditingReview ? 'Save Changes' : 'Submit Review'"></button>
        </div>
      </form>
    </div>
  </div>

       home service, and profile mixins live on their own pages. -->

  <script src="../../scripts/customer/dashboard-reviews.js"></script>
  <script src="../../scripts/customer/dashboard.js"></script>
