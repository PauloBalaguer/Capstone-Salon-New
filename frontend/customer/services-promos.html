<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../shared/theme-tokens.css?v=20261111-card-tones">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leo Mejillano Salon - Services & Promotions</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            luxury: {
              50: '#EEF7F2', 100: '#DDF0E6', 200: '#DDF0E6', 500: '#16604B',
              600: '#16604B', 700: '#0E3B2F', 800: '#0E3B2F', 900: '#0E3B2F', 950: '#F6F8F7',
            },
            gold: {
              100: '#FAF2DC', 400: '#E0B84C', 500: '#E0B84C', 600: '#E0B84C',
            }
          }
        }
      }
    }
  </script>

  <style>
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--brand); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--brand-dark); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .stagger-item { animation: fadeUp .45s cubic-bezier(.16,1,.3,1) both; }

    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .skeleton { background: linear-gradient(90deg, var(--bg) 25%, var(--border) 37%, var(--bg) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }

    @keyframes gentlePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    .pulse-badge { animation: gentlePulse 1.6s ease-in-out infinite; }

    @keyframes topbarShine { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    .topbar-shine { background-size: 200% 100%; animation: topbarShine 7s linear infinite; }

    .card-lift { transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    .card-lift:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -8px rgba(22, 96, 75, 0.35); }
  
    /* On/off switch: grey pill when off, green when on, white knob slides across. */
    .lm-switch { position:relative !important; display:inline-block !important; flex:none !important; width:52px !important; height:30px !important; min-width:52px !important; min-height:0 !important; max-height:30px !important; box-sizing:border-box !important; vertical-align:middle; padding:0 !important; border-radius:999px !important; border:2px solid var(--border-strong) !important; background:var(--border-strong) !important; cursor:pointer; transition:background-color .2s, border-color .2s; }
    .lm-switch.is-on { background:var(--success) !important; border-color:var(--success) !important; }
    .lm-switch:focus-visible { outline:3px solid var(--brand); outline-offset:2px; }
    .lm-switch-knob { position:absolute !important; top:0 !important; left:0 !important; width:26px !important; height:26px !important; min-height:0 !important; box-sizing:border-box !important; border-radius:50% !important; background:#fff !important; border:0 !important; box-shadow:0 1px 3px rgba(0,0,0,.3); transform:translateX(0); transition:transform .2s; }
    .lm-switch.is-on .lm-switch-knob { transform:translateX(22px); }
    @media (prefers-reduced-motion: reduce) { .lm-switch, .lm-switch-knob { transition:none; } }
  </style>
  <link rel="stylesheet" href="../../frontend/customer/customer-theme.css?v=20261104-notif2">
  <link rel="stylesheet" href="../../frontend/shared/payment-methods.css?v=20261104-payment-logos">
  <script src="../../function/customer/theme-config.js"></script>
<script src="../../function/shared/booking-validation.js"></script>
  <link rel="stylesheet" href="../../frontend/shared/responsive-base.css?v=20261103b" />
  <link rel="stylesheet" href="../../frontend/shared/portal-colors.css?v=20261103-signout-cream" />
  <script src="../../function/shared/toast.js"></script>
  <script src="../../function/shared/portal-presentation.js"></script>
  <script src="../../function/shared/pending-payment.js"></script>
  <!-- Clean theme: loaded last so it overrides older theme colours. -->
  <link rel="stylesheet" href="../../frontend/shared/clean-theme.css?v=20261104-notif4">
  <!-- Customer portal shell (sidebar, header, bottom nav); loaded after the shared themes. -->
  <link rel="stylesheet" href="../../frontend/customer/customer-portal.css?v=20261110">
  <link rel="stylesheet" href="../shared/type-scale.css?v=20261111-notif">
  <link rel="stylesheet" href="services-mobile.css?v=20261112">
</head>
<body data-customer-page="services" data-page-title="Explore Services" class="salon-portal services-page bg-luxury-950 text-slate-100 font-sans min-h-screen antialiased selection:bg-luxury-500 selection:text-white"
      x-data="customerApp()" x-init="init()" x-cloak>


  <div class="services-shell flex overflow-hidden flex-col md:flex-row">

    <div data-customer-shell="sidebar"></div>

    <main class="flex-1 flex flex-col bg-slate-950 overflow-y-auto">

      <div data-customer-shell="header"></div>

      <div id="pendingPaymentNotice" class="shrink-0" aria-live="polite"></div>

      <div x-show="isBooting" class="p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="h-28 rounded-2xl skeleton"></div>
          <div class="h-28 rounded-2xl skeleton"></div>
          <div class="h-28 rounded-2xl skeleton"></div>
        </div>
        <div class="h-64 rounded-2xl skeleton"></div>
      </div>

      <div x-show="!isBooting" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">

        <div class="p-6 space-y-6 pb-24 md:pb-6">
          <div class="services-content mx-auto">
            <div class="cp-intro">
              <div class="cp-intro-copy">
                <span class="cp-eyebrow" x-text="bookingEntry || showBookingForm ? 'YOUR NEXT VISIT' : 'TREAT YOURSELF'"></span>
                <h1><span x-text="bookingEntry || showBookingForm ? 'Book an' : 'Explore our'"></span> <em x-text="bookingEntry || showBookingForm ? 'appointment' : 'services'"></em></h1>
                <p x-text="bookingEntry || showBookingForm ? 'Choose your branch, add services, and find a time that works for you.' : 'Find the care that feels right for you.'"></p>
              </div>
            </div>

            <div class="flex items-center justify-center gap-1.5 sm:gap-3 mb-4 flex-wrap" x-show="showBookingForm || showBookingSuccess || selectedServicesForBooking.length > 0">
              <template x-for="(label, i) in bookingProgressLabels()" :key="label">
                <div class="flex items-center gap-1.5 sm:gap-2">
                  <div class="w-6 h-6 sm:w-7 sm:h-7 rounded-full border flex items-center justify-center text-xs sm:text-xs font-bold transition-all duration-300"
                       :class="i === bookingProgressIndex() ? 'bg-gold-500 text-slate-950 border-gold-500 scale-110' : (i < bookingProgressIndex() ? 'bg-luxury-700 text-white border-luxury-700' : 'bg-slate-800 text-slate-500 border-slate-700')"
                       x-text="i + 1"></div>
                  <span class="text-xs transition-colors duration-300" :class="i === bookingProgressIndex() ? 'text-white font-semibold' : 'text-slate-500'" x-text="label"></span>
                  <div x-show="i < bookingProgressLabels().length - 1" class="w-3 sm:w-8 h-px bg-slate-700"></div>
                </div>
              </template>
            </div>

            <div class="bg-slate-900 border border-luxury-900 rounded-2xl p-5 space-y-4">
              <p x-show="bookingEntry && !showBookingForm && !showBookingSuccess" class="text-sm text-slate-400">Choose a branch, then tap <strong>Book now</strong> on the service you want.</p>
              <!-- Branch: three short pills instead of a dropdown (full name shown below). -->
              <div x-show="!showBookingForm && !showBookingSuccess" class="space-y-1.5">
                <div role="radiogroup" aria-label="Branch" class="grid grid-cols-3 gap-1 p-1 rounded-xl bg-[color:var(--border)]">
                  <template x-for="b in serviceBranches" :key="b.key">
                    <button type="button" role="radio" :aria-checked="(selectedBranchForServices === b.key).toString()" :title="b.name"
                            @click="chooseServiceBranch(b.key)"
                            :class="selectedBranchForServices === b.key ? 'bg-[color:var(--brand)] text-white shadow' : 'text-[color:var(--text-body-color)] hover:bg-[color:var(--border)]'"
                            class="min-h-10 rounded-lg px-2 text-sm font-semibold transition truncate" x-text="b.short"></button>
                  </template>
                </div>
                <p class="text-xs text-[color:var(--muted)]" x-text="(serviceBranches.find(b => b.key === selectedBranchForServices) || {}).name"></p>
              </div>

              <p x-show="showBookingForm" class="text-xs text-slate-400"><strong>Branch:</strong> <span x-text="{'daraga':'Leo Mejillano Salon (Daraga)','yashano':'Skin Brows (Yashano)','cabangan':'Lash &amp; Brows (Cabangan)'}[selectedBranchForServices]"></span></p>
              <template x-if="!showBookingForm && !showBookingSuccess">
                <div>
                  <div class="space-y-3">
                    <!-- Compact toolbar: search + category on one row, then count + view switch. -->
                    <div class="cp-service-filters flex gap-2 mt-2">
                      <div class="relative flex-1 min-w-0">
                        <label for="service-search" class="sr-only">Search services</label>
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-[color:var(--muted)] pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                        <input id="service-search" type="search" x-model.debounce.200ms="serviceSearch" @input="servicePage = 1" placeholder="Search services"
                               class="w-full h-11 pl-9 pr-3 rounded-lg bg-white border border-[color:var(--border)] text-sm text-[color:var(--text)] focus:outline-none focus:ring-2 focus:ring-[#16604B]/30">
                      </div>
                      <div class="w-[42%] max-w-[14rem] shrink-0">
                        <label for="service-category" class="sr-only">Category</label>
                        <select id="service-category" x-model="serviceCategory" @change="servicePage = 1"
                                class="w-full h-11 px-2.5 rounded-lg bg-white border border-[color:var(--border)] text-sm text-[color:var(--text)] focus:outline-none focus:ring-2 focus:ring-[#16604B]/30">
                          <option value="">All categories</option>
                          <template x-for="g in serviceCategoryGroups()" :key="g.group">
                            <optgroup :label="g.group">
                              <template x-for="c in g.items" :key="c.value"><option :value="c.value" x-text="c.label"></option></template>
                            </optgroup>
                          </template>
                        </select>
                      </div>
                    </div>

                    <div class="flex items-center justify-between gap-2 flex-wrap">
                      <div class="flex items-center gap-2 flex-wrap min-w-0">
                        <p id="service-catalog-heading" tabindex="-1" class="text-sm font-semibold text-[color:var(--text-body-color)] focus:outline-none" role="status" x-text="serviceCount()"></p>
                        <!-- Active filters as removable chips -->
                        <button type="button" x-show="serviceCategory" @click="serviceCategory = ''; servicePage = 1"
                                class="inline-flex items-center gap-1 max-w-[12rem] rounded-full bg-[color:var(--brand-softer)] text-[color:var(--brand)] text-xs font-semibold pl-2.5 pr-1.5 py-1"
                                :aria-label="'Remove category filter ' + serviceCategoryLabel(serviceCategory)">
                          <span class="truncate" x-text="serviceCategoryLabel(serviceCategory)"></span><span aria-hidden="true" class="text-base leading-none">&times;</span>
                        </button>
                        <button type="button" x-show="serviceSearch" @click="serviceSearch = ''; servicePage = 1"
                                class="inline-flex items-center gap-1 max-w-[12rem] rounded-full bg-[color:var(--brand-softer)] text-[color:var(--brand)] text-xs font-semibold pl-2.5 pr-1.5 py-1"
                                :aria-label="'Clear search ' + serviceSearch">
                          <span class="truncate" x-text="'“' + serviceSearch + '”'"></span><span aria-hidden="true" class="text-base leading-none">&times;</span>
                        </button>
                      </div>
                      <div role="radiogroup" aria-label="Layout" class="inline-flex p-0.5 rounded-lg bg-[color:var(--border)]">
                        <button type="button" role="radio" :aria-checked="(serviceView === 'cards').toString()" @click="setServiceView('cards')" aria-label="Card view" title="Card view"
                                :class="serviceView === 'cards' ? 'bg-white text-[color:var(--brand)] shadow' : 'text-[color:var(--muted)]'" class="w-10 h-9 inline-flex items-center justify-center rounded-md">
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
                        </button>
                        <button type="button" role="radio" :aria-checked="(serviceView === 'table').toString()" @click="setServiceView('table')" aria-label="Table view" title="Table view"
                                :class="serviceView === 'table' ? 'bg-white text-[color:var(--brand)] shadow' : 'text-[color:var(--muted)]'" class="w-10 h-9 inline-flex items-center justify-center rounded-md">
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h18M3 10h18M3 15h18M3 20h18"/></svg>
                        </button>
                      </div>
                    </div>

                    <!-- Cards: name, price, duration, promo tag, actions. -->
                    <div x-show="serviceView === 'cards'" class="grid grid-cols-1 sm:grid-cols-2 2xl:grid-cols-3 gap-3">
                      <template x-for="service in pagedServices()" :key="service.id">
                        <article class="flex flex-col gap-2 rounded-xl border bg-[color:var(--card)] p-3.5 transition"
                                 :class="isSelectedForBooking(service) ? 'border-[color:var(--brand)] ring-1 ring-[color:var(--brand)]' : 'border-[color:var(--border)]'">
                          <div class="flex items-start justify-between gap-3">
                            <h5 class="font-semibold text-[15px] leading-snug text-[color:var(--text)] min-w-0" x-text="service.name"></h5>
                            <p class="shrink-0 font-bold text-[15px] text-[color:var(--accent-ink)]" x-text="formatPeso(service.price)"></p>
                          </div>
                          <p class="flex items-center gap-2 text-xs text-[color:var(--muted)]">
                            <span class="inline-flex items-center gap-1">
                              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                              <span x-text="ServiceDuration.format(service.durationMinutes)"></span>
                            </span>
                            <span x-show="getPromoForService(service)" class="rounded-full bg-[color:var(--warn-soft)] text-[color:var(--accent-ink)] font-semibold px-2 py-0.5">Promo</span>
                          </p>
                          <div class="grid grid-cols-2 gap-2 mt-auto pt-1">
                            <button type="button" @click="toggleServiceSelection(service)" :aria-pressed="isSelectedForBooking(service)"
                                    :aria-label="(isSelectedForBooking(service) ? 'Remove ' : 'Add ') + service.name"
                                    :class="isSelectedForBooking(service) ? 'bg-[color:var(--brand-softer)] border-[color:var(--brand)]' : 'bg-transparent border-[color:var(--border-strong)] hover:bg-[#16604B]/5'"
                                    class="min-h-10 rounded-lg border text-sm font-semibold text-[color:var(--brand)] transition" x-text="isSelectedForBooking(service) ? 'Added ✓' : '+ Add'"></button>
                            <button type="button" @click="bookNowService(service)" class="min-h-10 rounded-lg bg-[color:var(--brand)] hover:bg-[color:var(--brand-dark)] text-white text-sm font-bold transition active:scale-95">Book now</button>
                          </div>
                        </article>
                      </template>
                    </div>

                    <!-- Table: one row per service; duration folds under the name on phones. -->
                    <div x-show="serviceView === 'table' && getFilteredServices().length" class="cp-service-table-wrap rounded-xl border border-[color:var(--border)] bg-[color:var(--card)]">
                      <table class="w-full text-sm text-[color:var(--text)]">
                        <thead class="bg-[color:var(--bg)] text-xs uppercase tracking-wide text-[color:var(--muted)]">
                          <tr>
                            <th scope="col" class="text-justify font-bold px-3 py-2">Service</th>
                            <th scope="col" class="hidden sm:table-cell text-justify font-bold px-3 py-2">Duration</th>
                            <th scope="col" class="text-right font-bold px-3 py-2">Price</th>
                            <th scope="col" class="px-2 py-2"><span class="sr-only">Actions</span></th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="service in pagedServices()" :key="service.id">
                            <tr class="border-t border-[color:var(--border)]" :class="isSelectedForBooking(service) ? 'bg-[#EEF7F2]/60' : ''">
                              <td class="px-3 py-2.5 align-middle w-full">
                                <span class="font-semibold leading-snug" x-text="service.name"></span>
                                <span x-show="getPromoForService(service)" class="ml-1 align-middle rounded-full bg-[color:var(--warn-soft)] text-[color:var(--accent-ink)] text-[11px] font-semibold px-1.5 py-0.5">Promo</span>
                                <span class="sm:hidden block text-xs text-[color:var(--muted)]" x-text="ServiceDuration.format(service.durationMinutes)"></span>
                              </td>
                              <td class="hidden sm:table-cell px-3 py-2.5 text-[color:var(--text-body-color)] whitespace-nowrap" x-text="ServiceDuration.format(service.durationMinutes)"></td>
                              <td class="px-3 py-2.5 text-right font-bold text-[color:var(--accent-ink)] whitespace-nowrap" x-text="formatPeso(service.price)"></td>
                              <td class="px-2 py-2 whitespace-nowrap text-right">
                                <div class="inline-flex gap-1.5">
                                  <button type="button" @click="toggleServiceSelection(service)" :aria-pressed="isSelectedForBooking(service)"
                                          :aria-label="(isSelectedForBooking(service) ? 'Remove ' : 'Add ') + service.name" :title="isSelectedForBooking(service) ? 'Remove' : 'Add'"
                                          :class="isSelectedForBooking(service) ? 'bg-[color:var(--brand)] text-white border-[color:var(--brand)]' : 'text-[color:var(--brand)] border-[color:var(--border-strong)] hover:bg-[#16604B]/5'"
                                          class="shrink-0 w-10 h-10 rounded-lg border text-lg font-bold leading-none" x-text="isSelectedForBooking(service) ? '✓' : '+'"></button>
                                  <button type="button" @click="bookNowService(service)" :aria-label="'Book ' + service.name" class="shrink-0 h-10 px-3 rounded-lg bg-[color:var(--brand)] hover:bg-[color:var(--brand-dark)] text-white text-sm font-bold whitespace-nowrap [overflow-wrap:normal]">Book</button>
                                </div>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>

                    <div x-show="getFilteredServices().length === 0" class="service-empty-state">
                      <p class="text-slate-400 text-xs">No services match your search in this branch.</p>
                      <button type="button" @click="resetServiceFilters()" class="service-add-button mt-2">Clear filters</button>
                    </div>
                    <nav x-show="servicePageCount() > 1" class="flex items-center justify-between gap-3 pt-1" aria-label="Service pages">
                      <button type="button" @click="changeServicePage(-1)" :disabled="servicePage <= 1" class="service-add-button min-h-10">← Previous</button>
                      <span class="text-xs text-[color:var(--text-body-color)]" x-text="'Page ' + Math.min(servicePage, servicePageCount()) + ' of ' + servicePageCount()"></span>
                      <button type="button" @click="changeServicePage(1)" :disabled="servicePage >= servicePageCount()" class="service-add-button min-h-10">Next →</button>
                    </nav>
                  </div>

                  <div class="space-y-3">
                    <h4 class="font-serif text-base font-bold text-gold-400 mt-6">Active Promotions at <span x-text="selectedBranchForServices.charAt(0).toUpperCase() + selectedBranchForServices.slice(1)"></span></h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <template x-for="(promo, i) in getFilteredPromotions()" :key="promo.id">
                        <div class="card-lift stagger-item bg-gradient-to-br from-luxury-800 to-luxury-900 border border-gold-500 rounded-lg p-4 space-y-2 relative overflow-hidden" :style="'animation-delay:' + (i * 50) + 'ms'">
                          <div class="absolute top-0 right-0 bg-gold-500 text-slate-950 text-xs font-bold px-2 py-1 rounded-bl-lg">PROMO</div>
                          <p class="text-base font-bold text-white" x-text="promo.title"></p>
                          <p class="text-xs text-slate-300" x-text="promo.description"></p>
                          <div class="flex items-baseline space-x-2">
                            <p class="text-lg font-bold text-gold-400" x-text="formatPeso(promo.price)"></p>
                            <p class="text-xs text-slate-400 line-through" x-text="formatPeso(promo.originalPrice)"></p>
                          </div>
                          <button @click="openBookingSection(promo)" class="mt-2 w-full bg-gold-500 hover:bg-gold-600 text-slate-950 text-xs font-bold py-2 rounded-lg transition active:scale-95">Book now</button>
                        </div>
                      </template>
                      <template x-if="getFilteredPromotions().length === 0">
                        <p class="text-slate-400 text-xs  col-span-2">No active promotions for this branch.</p>
                      </template>
                    </div>
                  </div>

                  <div x-show="selectedServicesForBooking.length > 0" x-transition class="pt-6 border-t border-slate-800 mt-6 space-y-4">
                    <h4 class="font-serif text-base font-bold text-white">Your Selection</h4>
                    <ul class="space-y-2">
                      <template x-for="service in selectedServicesForBooking" :key="service.id">
                        <li class="flex justify-between items-center text-xs bg-slate-800 p-3 rounded-lg">
                          <div>
                            <p class="font-medium text-white" x-text="service.name"></p>
                            <p class="text-slate-400" x-text="formatServiceDuration(service)"></p>
                          </div>
                          <div class="flex items-center space-x-2">
                            <p class="font-bold text-gold-400" x-text="formatPeso(service.price)"></p>
                            <button @click="toggleServiceSelection(service)" class="ui-close-icon text-rose-400 hover:text-rose-300 text-base">&times;</button>
                          </div>
                        </li>
                      </template>
                    </ul>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-800">
                      <p class="text-base font-bold text-white" x-text="'Total: ' + formatPeso(selectedServicesForBooking.reduce((sum, s) => sum + s.price, 0))"></p>
                      <button @click="openBookingSection()" class="px-5 py-2 bg-gradient-to-r from-luxury-600 to-luxury-800 text-white font-bold rounded-lg hover:shadow-lg hover:shadow-luxury-600/20 transition active:scale-95">Proceed to Booking</button>
                    </div>
                  </div>

                  <div class="pt-6 border-t border-slate-800 mt-6">
                    <p class="prose-justify text-xs text-slate-500 ">
                      Note: Prices and availability are subject to change. Choose Book Now to check available schedules. Your final price and required payment are shown before confirmation.
                    </p>
                  </div>
                </div>
              </template>

              <template x-if="showBookingForm">

                            <li class="prose-justify"><strong class="text-slate-300">50% or full payment:</strong> Depending on the service selected, you must pay either a 50% down payment or the full amount upfront, the required amount is shown before you book.</li>
                            <li class="prose-justify"><strong class="text-slate-300">Payment verification:</strong> Online payments (GCash, Maya or card) are processed securely by PayMongo; Cash must be settled in person. Your payment stays "Payment Being Verified" until staff confirm it, you can never verify your own payment.</li>
                            <li class="prose-justify"><strong class="text-slate-300">Confirmation rules:</strong> Your requested time is held as <strong class="text-slate-300">Pending</strong> until the branch verifies your payment and confirms it, it is not guaranteed until confirmed.</li>

                    <p x-show="bookingError" x-text="bookingError" role="alert" class="text-rose-200 bg-rose-950 rounded-lg p-3"></p>

                          <p id="schedule-continue-hint" x-show="bookingStep === 'schedule' && scheduleContinueHint()" class="text-xs text-slate-500" role="status" x-text="scheduleContinueHint()"></p>
                    <div class="pt-2 flex flex-wrap gap-3 justify-between border-t border-slate-800">
                      <button type="button" @click="bookingStep === 'schedule' ? cancelBookingForm() : goToPreviousBookingStep()" :disabled="isSubmittingBooking" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition disabled:opacity-50" x-text="bookingStep === 'schedule' ? 'Back to services' : 'Back'"></button>

                      <button type="button" x-show="bookingStep === 'schedule'" @click="proceedFromSchedule()" :disabled="!canContinueSchedule()" :aria-busy="slotsLoading || staffAvailabilityLoading" aria-describedby="schedule-continue-hint" class="disabled:opacity-50 disabled:cursor-not-allowed px-5 py-2 bg-gradient-to-r from-luxury-600 to-luxury-800 text-white font-bold rounded-lg transition active:scale-95">Continue</button>
                      <button type="button" x-show="bookingStep === 'review'" id="continue-to-payment" @click="proceedFromReview()" :disabled="!bookingForm.customerName || !bookingForm.customerPhone" class="px-5 py-2 bg-gradient-to-r from-luxury-600 to-luxury-800 text-white font-bold rounded-lg transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">Continue to Payment</button>
                      <button type="button" x-show="bookingStep === 'payment' && !depositLocked" @click="proceedFromPayment()" class="px-5 py-2 bg-luxury-600 hover:bg-luxury-700 text-white font-bold rounded-lg transition active:scale-95" :disabled="reservationQuoteLoading || !reservationQuote || !bookingForm.paymentMethod">Continue</button>
                      <button type="button" x-show="bookingStep === 'payment' && depositLocked" @click="bookingStep = 'notifications'" class="px-5 py-2 bg-gradient-to-r from-luxury-600 to-luxury-800 text-white font-bold rounded-lg transition active:scale-95">Continue</button>
                      <button type="button" x-show="bookingStep === 'notifications'" @click="proceedFromNotifications()" class="px-5 py-2 bg-gradient-to-r from-luxury-600 to-luxury-800 text-white font-bold rounded-lg transition active:scale-95">Continue</button>
                      <button type="button" x-show="bookingStep === 'terms'" @click="submitBooking()" :aria-busy="isSubmittingBooking" :disabled="isSubmittingBooking || !bookingForm.agreedToTerms" class="px-5 py-2 bg-gradient-to-r from-gold-500 to-gold-600 text-slate-900 font-bold rounded-lg transition disabled:opacity-70 disabled:cursor-not-allowed flex items-center gap-2">
                        <svg x-show="isSubmittingBooking" class="animate-spin h-3.5 w-3.5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                        <span x-text="isSubmittingBooking ? 'Processing...' : (bookingForm.paymentMethod.startsWith('PayMongo') &amp;&amp; requiredDeposit() > 0 ? 'Continue to Payment' : 'Submit Request')"></span>
                      </button>
                    </div>
                  </form>
                </div>
              </template>

              <template x-if="showBookingSuccess">
                <div class="pt-6 border-t border-slate-800 mt-6 space-y-4 text-center" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100">
                  <div class="w-16 h-16 bg-emerald-950 border-4 border-[color:var(--success)] rounded-full flex items-center justify-center mx-auto">
                    <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                  </div>
                  <h4 class="font-serif text-lg font-bold text-white">Booking Request Received</h4>
                  <p class="text-slate-400 text-base">Your appointment request has been sent. You will receive a confirmation message shortly.</p>

                  <div x-show="bookingSuccessDetails" class="bg-slate-800 rounded-lg p-4 text-justify text-xs my-4 space-y-2">
                    <p class="text-center font-bold text-gold-400 mb-3">Booking Reference: <span class="font-mono bg-slate-900 px-2 py-1 rounded" x-text="bookingSuccessDetails?.id"></span></p>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Branch:</strong><span class="text-white text-right" x-text="bookingSuccessDetails?.branchName"></span></div>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Service(s):</strong><span class="text-white text-right" x-text="bookingSuccessDetails?.serviceName"></span></div>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Date & Time:</strong><span class="text-white text-right" x-text="bookingSuccessDetails?.date + ' @ ' + bookingSuccessDetails?.time"></span></div>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Estimated Duration:</strong><span class="text-white" x-text="ServiceDuration.format(bookingSuccessDetails?.durationMinutes)"></span></div>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Estimated End Time:</strong><span class="text-white" x-text="bookingSuccessDetails?.endTime"></span></div>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Staff:</strong><span class="text-white text-right" x-text="bookingSuccessDetails?.staffName"></span></div>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Pay Now:</strong><span class="text-white text-right" x-text="formatPeso(bookingSuccessDetails?.depositAmount) + ' via ' + PortalPresentation.methodLabel(bookingSuccessDetails?.paymentMethod) + (bookingSuccessDetails?.depositReference ? ' (Ref: ' + bookingSuccessDetails.depositReference + ')' : '')"></span></div>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Balance to Pay Later:</strong><span class="text-white" x-text="formatPeso(bookingSuccessDetails?.remainingBalance)"></span></div>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-700"><strong class="text-slate-500">Service Total:</strong><span class="font-bold text-gold-400" x-text="formatPeso(bookingSuccessDetails?.price)"></span></div>
                  </div>
                  <p x-show="lateArrivalRule" class="bg-slate-800 rounded-lg p-3 text-justify text-xs text-slate-300"><strong class="text-slate-200">Late arrival:</strong> <span x-text="lateArrivalRule"></span></p>

                  <div class="flex flex-col sm:flex-row justify-center gap-2 sm:gap-3">
                    <button @click="closeBookingSection()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition active:scale-95">Book Another Service</button>
                    <a href="appointments.html" class="px-5 py-2 bg-gradient-to-r from-luxury-600 to-luxury-800 text-white font-bold rounded-lg hover:shadow-lg hover:shadow-luxury-600/20 transition active:scale-95">Track Booking</a>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>

      </div>
      <div data-customer-shell="footer"></div>
    </main>
  </div>

  <div data-customer-shell="bottom-nav"></div>
  <div data-customer-shell="signout"></div>

</body>
