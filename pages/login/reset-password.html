<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leo Mejillano Salon &amp; Beauty — Reset Password</title>
  <link rel="stylesheet" href="../../assets/css/login-base.css" />
</head>

<body>
  <div class="page page-stacked">
    <div class="page-dots" aria-hidden="true"></div>

    <div class="top-bar" data-auth-topbar></div>

    <div class="card">
      <div id="step-code">
        <span class="card-badge">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M3 7l9 6 9-6" />
          </svg>
        </span>

        <span class="card-eyebrow">Account recovery</span>
        <h1 class="card-title">Enter your code</h1>
        <p class="card-text">
          We sent a 6-digit code to
          <strong id="target-email">your email</strong>. Enter it below to
          continue.
        </p>

        <form id="verify-code-form" class="form" novalidate>
          <div class="otp-row">
            <input type="text" class="otp-digit" inputmode="numeric" maxlength="1" autocomplete="one-time-code"
              aria-label="Digit 1" />
            <input type="text" class="otp-digit" inputmode="numeric" maxlength="1" aria-label="Digit 2" />
            <input type="text" class="otp-digit" inputmode="numeric" maxlength="1" aria-label="Digit 3" />
            <input type="text" class="otp-digit" inputmode="numeric" maxlength="1" aria-label="Digit 4" />
            <input type="text" class="otp-digit" inputmode="numeric" maxlength="1" aria-label="Digit 5" />
            <input type="text" class="otp-digit" inputmode="numeric" maxlength="1" aria-label="Digit 6" />
          </div>

          <button type="submit" class="btn-main">Verify code</button>
        </form>

        <div class="divider" aria-hidden="true">
          <span></span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M12 2C9 7 6 9 6 13a6 6 0 0 0 12 0c0-4-3-6-6-11z" />
          </svg>
          <span></span>
        </div>

        <p class="card-foot">
          Didn't get a code?
          <button type="button" id="resend-btn" class="link-gold">
            Resend code
          </button>
        </p>
        <p class="card-foot">
          Wrong email?
          <a href="forgot-password.html" class="link-gold">Start over</a>
        </p>
      </div>

      <div id="step-password" style="display: none">
        <span class="card-badge">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7">
            <rect x="4" y="10" width="16" height="10" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>
        </span>

        <span class="card-eyebrow">Account recovery</span>
        <h1 class="card-title">Set new password</h1>
        <p class="card-text">
          Code verified. Please enter and confirm your new password.
        </p>

        <form id="reset-password-form" class="form" novalidate>
          <div class="field">
            <label for="new-password">New password</label>
            <div class="field-box">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7">
                <rect x="4" y="10" width="16" height="10" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>
              <input id="new-password" name="new_password" type="password" autocomplete="new-password"
                placeholder="At least 8 characters" />
              <button type="button" class="eye-btn" data-toggle-password="new-password" aria-label="Show password">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                  <line data-eye-slash style="display: none" x1="3" y1="3" x2="21" y2="21" />
                </svg>
              </button>
            </div>
            <p class="field-error" id="new-password-error"></p>
          </div>

          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <div class="field-box">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7">
                <rect x="4" y="10" width="16" height="10" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>
              <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password"
                placeholder="Type it again" />
              <button type="button" class="eye-btn" data-toggle-password="confirm-password" aria-label="Show password">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                  <line data-eye-slash style="display: none" x1="3" y1="3" x2="21" y2="21" />
                </svg>
              </button>
            </div>
            <p class="field-error" id="confirm-password-error"></p>
          </div>

          <button type="submit" class="btn-main">Reset password</button>
        </form>
      </div>
    </div>

    <span class="page-note" data-auth-footer></span>
  </div>

  <div class="loading" id="loading" aria-hidden="true">
    <div class="spinner"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../../scripts/login/common.js?v=2"></script>
  <script src="../../scripts/login/reset-password.js"></script>
</body>

</html>
