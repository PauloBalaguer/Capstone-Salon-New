<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leo Mejillano Salon &amp; Beauty — Welcome</title>
  <link rel="stylesheet" href="../../assets/css/login-base.css" />
  <link rel="stylesheet" href="../../assets/css/login-theme.css" />
</head>
<body>
  <div class="photo-backdrop" aria-hidden="true"></div>
  <div class="page">
    <div class="page-dots" aria-hidden="true"></div>
    <section class="welcome-cover" id="cover" aria-labelledby="welcome-title">
      <div class="top-bar" data-auth-topbar></div>
      <div class="cover-hero">
        <span class="card-eyebrow">Salon &amp; Beauty</span>
        <h1 class="cover-title" id="welcome-title">Where beauty<br><em>meets care</em></h1>
        <p class="cover-text">Your next salon visit starts here. Log in to book an appointment and manage your visits.</p>
        <button type="button" class="welcome-entry" id="aperture-btn">
          <span class="welcome-circle" aria-hidden="true"><span class="welcome-core">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          </span></span>
          <span class="welcome-label">Continue to log in</span>
        </button>
      </div>
      <span class="page-note" data-auth-footer></span>
    </section>

    <div class="reveal-overlay" id="login-reveal" hidden>
      <div class="card">
        <button type="button" class="close-link" id="close-btn">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          Close
        </button>

        <span class="card-badge">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7">
            <rect x="4" y="10" width="16" height="10" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>
        </span>

        <span class="card-eyebrow">Salon &amp; Beauty</span>
        <h1 class="card-title">Welcome back</h1>

        <form id="login-form" class="form" novalidate>
          <div class="field">
            <label for="login-email">Email address</label>
            <div class="field-box">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="M3 7l9 6 9-6" />
              </svg>
              <input id="login-email" name="email" type="email" autocomplete="username" autocapitalize="none"
                spellcheck="false" placeholder="you@email.com" required />
            </div>
            <p class="field-error" id="login-email-error"></p>
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <div class="field-box">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7">
                <rect x="4" y="10" width="16" height="10" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>
              <input id="login-password" name="password" type="password" autocomplete="current-password"
                placeholder="Your password" required />
              <button type="button" class="eye-btn" data-toggle-password="login-password" aria-label="Show password">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                  <line data-eye-slash style="display: none" x1="3" y1="3" x2="21" y2="21" />
                </svg>
              </button>
            </div>
            <p class="field-error" id="login-password-error"></p>
          </div>

          <div class="form-row">
            <label class="checkbox">
              <input type="checkbox" id="remember-me" name="remember" />
              Remember me
            </label>
            <a href="forgot-password.html" class="link-gold">Forgot password?</a>
          </div>

          <button type="submit" class="btn-main">Sign in</button>
        </form>

        <div class="divider" aria-hidden="true">
          <span></span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M12 2C9 7 6 9 6 13a6 6 0 0 0 12 0c0-4-3-6-6-11z" />
          </svg>
          <span></span>
        </div>

        <p class="card-foot">Don't have an account? <a href="register.html" class="link-gold">Register here</a></p>
      </div>
    </div>
  </div>

  <div class="loading" id="loading" aria-hidden="true">
    <div class="spinner"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../../scripts/login/common.js?v=2"></script>
  <script src="../../scripts/login/login.js"></script>
</body>
</html>
