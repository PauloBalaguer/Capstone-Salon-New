<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leo Mejillano Salon &amp; Beauty — Create Account</title>
  <link rel="stylesheet" href="../../assets/css/login-base.css" />
  </head>
  <body>
    <div class="page page-stacked">
      <div class="page-dots" aria-hidden="true"></div>

      <div class="top-bar" data-auth-topbar></div>

      <div class="card card-wide">
        <a href="login.html" class="close-link" aria-label="Back to login">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          Back to login
        </a>

        <span class="card-badge">
          <svg
            viewBox="0 0 24 24"
            width="19"
            height="19"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
          </svg>
        </span>

        <span class="card-eyebrow">New here?</span>
        <h1 class="card-title">Create an account</h1>
        <p class="card-text">
          One account for every branch, booking, and visit.
        </p>

        <form id="register-form" class="form" novalidate>
          <div class="field-row">
            <div class="field">
              <label for="reg-firstname">First name</label>
              <div class="field-box">
                <svg
                  viewBox="0 0 24 24"
                  width="17"
                  height="17"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                >
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
                </svg>
                <input
                  id="reg-firstname"
                  name="first_name"
                  type="text"
                  autocomplete="given-name"
                  placeholder="Juan"
                />
              </div>
              <p class="field-error" id="reg-firstname-error"></p>
            </div>

            <div class="field">
              <label for="reg-lastname">Last name</label>
              <div class="field-box">
                <svg
                  viewBox="0 0 24 24"
                  width="17"
                  height="17"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                >
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
                </svg>
                <input
                  id="reg-lastname"
                  name="last_name"
                  type="text"
                  autocomplete="family-name"
                  placeholder="Dela Cruz"
                />
              </div>
              <p class="field-error" id="reg-lastname-error"></p>
            </div>
          </div>

          <div class="field">
            <label for="reg-email">Email address</label>
            <div class="field-box">
              <svg
                viewBox="0 0 24 24"
                width="17"
                height="17"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              >
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="M3 7l9 6 9-6" />
              </svg>
              <input
                id="reg-email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@email.com"
              />
            </div>
            <p class="field-error" id="reg-email-error"></p>
          </div>

          <div class="field">
            <label for="reg-contact">Mobile number</label>
            <div class="field-box">
              <svg
                viewBox="0 0 24 24"
                width="17"
                height="17"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              >
                <path
                  d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"
                />
              </svg>
              <input
                id="reg-contact"
                name="contact_number"
                type="tel"
                class="digits-only"
                inputmode="numeric"
                maxlength="11"
                autocomplete="tel"
                placeholder="09XXXXXXXXX"
              />
            </div>
            <p class="field-error" id="reg-contact-error"></p>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="reg-password">Password</label>
              <div class="field-box">
                <svg
                  viewBox="0 0 24 24"
                  width="17"
                  height="17"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                >
                  <rect x="4" y="10" width="16" height="10" rx="2" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
                <input
                  id="reg-password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  placeholder="At least 8 characters"
                />
                <button
                  type="button"
                  class="eye-btn"
                  data-toggle-password="reg-password"
                  aria-label="Show password"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="17"
                    height="17"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                  >
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                    <circle cx="12" cy="12" r="3" />
                    <line
                      data-eye-slash
                      style="display: none"
                      x1="3"
                      y1="3"
                      x2="21"
                      y2="21"
                    />
                  </svg>
                </button>
              </div>
              <p class="field-error" id="reg-password-error"></p>
            </div>

            <div class="field">
              <label for="reg-confirm-password">Confirm password</label>
              <div class="field-box">
                <svg
                  viewBox="0 0 24 24"
                  width="17"
                  height="17"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                >
                  <rect x="4" y="10" width="16" height="10" rx="2" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
                <input
                  id="reg-confirm-password"
                  name="confirm_password"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Type it again"
                />
                <button
                  type="button"
                  class="eye-btn"
                  data-toggle-password="reg-confirm-password"
                  aria-label="Show password"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="17"
                    height="17"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                  >
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                    <circle cx="12" cy="12" r="3" />
                    <line
                      data-eye-slash
                      style="display: none"
                      x1="3"
                      y1="3"
                      x2="21"
                      y2="21"
                    />
                  </svg>
                </button>
              </div>
              <p class="field-error" id="reg-confirm-password-error"></p>
            </div>
          </div>

          <button type="submit" class="btn-main">Create account</button>
        </form>

        <div class="divider" aria-hidden="true">
          <span></span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M12 2C9 7 6 9 6 13a6 6 0 0 0 12 0c0-4-3-6-6-11z" />
          </svg>
          <span></span>
        </div>

        <p class="card-foot">
          Already have an account?
          <a href="login.html" class="link-gold">Log in</a>
        </p>
      </div>

      <span class="page-note" data-auth-footer></span>
    </div>

    <div class="loading" id="loading" aria-hidden="true">
      <div class="spinner"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="../../scripts/login/common.js?v=2"></script>
    <script src="../../scripts/login/register.js"></script>
  </body>
</html>
