# Apache site for the container. Replaces .htaccess there (AllowOverride None).
#
# The browser-facing URLs stay the same as on XAMPP, but only the folders named
# below are reachable. vendor/, backend/shared/ and the code root have no URL at all.

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Limits PHP processes, and so database connections, per container instance.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 5
    MaxRequestWorkers 20
</IfModule>

<VirtualHost *:${PORT}>
    DocumentRoot "${SALON_PUBLIC}"
    DirectoryIndex index.html

    AliasMatch "^/(frontend|function)(/.*)?$" "${SALON_APP}/$1$2"
    AliasMatch "^/backend/(admin|auth|cashier|customer|public|staff)(/.*)?$" "${SALON_APP}/backend/$1$2"

    # Only Vercel's proxy can reach the container and it sets these two headers,
    # so PHP sees the visitor's address (rate limits, audit log) and real HTTPS.
    # Each pair of ranges means "any address": Apache refuses a /0 mask.
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 0.0.0.0/1 128.0.0.0/1
    RemoteIPTrustedProxy ::/1 8000::/1
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</VirtualHost>

<Directory "${SALON_PUBLIC}">
    Options None
    AllowOverride None
    Require all granted
</Directory>

<Directory "${SALON_APP}">
    Options None
    AllowOverride None
    Require all denied
</Directory>

<DirectoryMatch "^${SALON_APP}/(frontend|function|backend/(admin|auth|cashier|customer|public|staff))(/|$)">
    Require all granted
</DirectoryMatch>

# Apache hides this header from PHP by default; Vercel Cron's secret arrives in it.
<Files "runCron.php">
    CGIPassAuth On
</Files>

# From .htaccess: private file types stay blocked even inside an allowed folder.
<FilesMatch "^(?:(?:brevo|paymongo|mail|sms)_credentials\.php(?:\..*)?|\.env.*|\.ht.*|composer\.(?:json|lock)|package(?:-lock)?\.json|skills-lock\.json|.*\.(?:md|sql|log))$">
    Require all denied
</FilesMatch>

# From .htaccess: edits show up on the next reload.
<FilesMatch "\.(css|js|html)$">
    Header set Cache-Control "no-cache, no-store, must-revalidate"
    Header set Pragma "no-cache"
    Header set Expires 0
</FilesMatch>
