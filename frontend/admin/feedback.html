<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../shared/theme-tokens.css?v=20261111-card-tones">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Feedback · Leo Mejillano Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../function/admin/theme-config.js"></script>
  <script>tailwind.config.corePlugins = { preflight: false };</script>
  <script src="../../function/shared/list-pager.js?v=20261111"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="../shared/notification-panel.css?v=20261111">
  <link rel="stylesheet" href="admin-panel.css?v=20261111-access">
  <link rel="stylesheet" href="../shared/portal-unify.css?v=20261110b">
  <script src="../../function/shared/toast.js"></script>
  <script src="../../function/shared/notification-panel.js?v=20261111"></script>
  <script src="../../function/shared/portal-presentation.js"></script>
  <link rel="stylesheet" href="../shared/type-scale.css?v=20261111-notif">
</head>
<body class="lm-admin" x-data="adminFeedbackApp()" x-init="init()">
<div class="lm-shell">
  <aside class="lm-sidebar" data-lm-sidebar></aside>

  <div class="lm-main">
    <header class="lm-topbar" data-lm-topbar>
      <div class="lm-topbar-title">
        <h1>Guest Feedback</h1>
        <p>Reviews from completed bookings, newest first. Marking a review as read only changes its admin status.</p>
      </div>
      <div class="lm-topbar-actions"></div>
    </header>

    <main class="lm-content" id="main">
      <div x-show="$store.admin.error" x-cloak class="lm-alert lm-alert--error" role="alert"><p x-text="$store.admin.error"></p><button type="button" class="lm-btn lm-btn--sm" @click="$store.admin.refresh()">Retry</button></div>

      <section class="lm-stats" aria-label="Feedback figures">
        <div data-card-tone="gold" class="lm-stat"><span class="lm-stat-label">Average rating</span><span class="lm-stat-value" x-text="$store.admin.feedback.length ? $store.admin.getAverageRating() + ' ★' : '—'"></span><span class="lm-stat-note">All reviews</span></div>
        <div data-card-tone="info" class="lm-stat"><span class="lm-stat-label">Total reviews</span><span class="lm-stat-value" x-text="$store.admin.feedback.length"></span></div>
        <button data-card-tone="info" type="button" class="lm-stat" @click="feedbackFilterRead = 'unread'"><span class="lm-stat-label">Unread</span><span class="lm-stat-value" x-text="$store.admin.feedback.filter(f => isUnread(f)).length"></span><span class="lm-stat-cta">Show unread →</span></button>
        <button data-card-tone="warning" type="button" class="lm-stat" @click="feedbackFilterRating = 'low'"><span class="lm-stat-label">Needs attention</span><span class="lm-stat-value lm-text-danger" x-text="$store.admin.feedback.filter(f => f.rating <= 3).length"></span><span class="lm-stat-note">3 stars or below</span></button>
      </section>

      <section class="lm-card" aria-label="Feedback filters">
        <div class="lm-toolbar">
          <label class="lm-field"><span>Branch</span>
            <select class="lm-select" x-model="feedbackFilterBranch"><option value="all">All branches</option><option value="off-site">Home service (off-site)</option><template x-for="branch in $store.admin.branches" :key="branch.id"><option :value="branch.id" x-text="branch.name"></option></template></select>
          </label>
          <label class="lm-field"><span>Star rating</span>
            <select class="lm-select" x-model="feedbackFilterRating"><option value="all">All ratings</option><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option><option value="low">3 stars and below</option></select>
          </label>
          <label class="lm-field"><span>Read status</span>
            <select class="lm-select" x-model="feedbackFilterRead"><option value="all">All</option><option value="unread">Unread</option><option value="read">Read</option></select>
          </label>
          <div class="lm-actions"><button type="button" class="lm-btn" @click="feedbackFilterBranch = 'all'; feedbackFilterRating = 'all'; feedbackFilterRead = 'all'">Clear</button></div>
        </div>
      </section>

      <div x-show="$store.admin.loading && !$store.admin.error" class="lm-loading" role="status"><span class="lm-spinner"></span>Loading reviews…</div>

      <section class="lm-grid lm-grid--2" x-show="!$store.admin.loading" aria-label="Reviews">
        <template x-for="review in $store.pager.slice('feedback', getFilteredFeedback())" :key="review.id">
          <article class="lm-card" style="display:flex;flex-direction:column;gap:10px" :style="isUnread(review) ? 'border-left:4px solid var(--lm-gold)' : ''">
            <div class="lm-actions" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">
              <div style="min-width:0"><span class="lm-cell-main" x-text="review.clientName"></span><span class="lm-cell-sub" x-text="(review.branchId ? $store.admin.getBranchName(review.branchId) : 'Home service (off-site)') + ' · ' + AdminUI.date(review.date)"></span></div>
              <span class="lm-stars" role="img" :aria-label="review.rating + ' out of 5 stars'"><template x-for="n in 5" :key="n"><svg viewBox="0 0 24 24" :class="n <= review.rating ? '' : 'is-off'"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></template></span>
            </div>
            <p class="lm-cell-sub" style="margin:0"><span x-text="review.serviceName || 'Service not recorded'"></span> · <span class="lm-ref" x-text="review.bookingReference || ''"></span> · Stylist: <span x-text="getStaffName(review.staffId)"></span></p>
            <p style="margin:0;flex:1;text-align:left" x-text="review.comment || 'No written comment.'" :class="review.comment ? '' : 'lm-text-muted'"></p>
            <div class="lm-actions" style="justify-content:space-between;border-top:1px solid var(--lm-border);padding-top:10px">
              <span :class="isUnread(review) ? 'lm-badge lm-badge--pending' : (review.adminStatus === 'Resolved' ? 'lm-badge lm-badge--success' : 'lm-badge lm-badge--info')" x-text="isUnread(review) ? 'Unread' : (review.adminStatus === 'Resolved' ? 'Read · resolved' : 'Read')"></span>
              <div class="lm-actions">
                <button type="button" class="lm-btn lm-btn--sm lm-btn--primary" x-show="isUnread(review)" :disabled="busyId === review.id" @click="setFeedbackStatus(review, 'Reviewed')">Mark as read</button>
                <button type="button" class="lm-btn lm-btn--sm" x-show="review.adminStatus !== 'Resolved'" :disabled="busyId === review.id" @click="setFeedbackStatus(review, 'Resolved')">Mark resolved</button>
                <button type="button" class="lm-btn lm-btn--sm lm-btn--ghost" x-show="!isUnread(review)" :disabled="busyId === review.id" @click="setFeedbackStatus(review, 'New')">Mark unread</button>
              </div>
            </div>
          </article>
        </template>
      </section>
      <div class="lm-card lm-card--flush" x-show="!$store.admin.loading && getFilteredFeedback().length > 10"><nav x-lm-pager="'feedback'" aria-label="Review pages"></nav></div>
      <div class="lm-card lm-empty" x-show="!$store.admin.loading && getFilteredFeedback().length === 0"><h3>No reviews match these filters</h3><p>Change the branch, rating or read status.</p></div>
    </main>
  </div>
</div>

<script src="../../function/shared/sign-out.js?v=20261111"></script>
<script src="../../function/admin/admin-shell.js?v=20261111-np"></script>
<script src="../../function/shared/live-sync.js?v=20261110"></script>
<script src="../../function/admin/shared-data.js?v=20261111"></script>
<script src="../../function/admin/feedback.js?v=20261110"></script>
<script src="../../function/shared/select-dropdown.js?v=20261111e"></script>
</body>
</html>
