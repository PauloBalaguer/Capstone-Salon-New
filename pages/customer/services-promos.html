    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .stagger-item { animation: fadeUp .45s cubic-bezier(.16,1,.3,1) both; }

    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    @keyframes gentlePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    .pulse-badge { animation: gentlePulse 1.6s ease-in-out infinite; }

    @keyframes topbarShine { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

             'border-[#99D5D6] bg-[#F0FAFA] text-[#06464A]': toast.type === 'info' || toast.type === 'system'
           }"
           class="border-2 rounded-xl px-4 py-3 shadow-2xl flex items-start gap-2 text-xs font-semibold">

        <button @click="dismissToast(toast.id)" class="opacity-60 hover:opacity-100 shrink-0 leading-none text-lg" aria-label="Dismiss">&times;</button>

        <div class="relative" @click.outside="isNotificationPanelOpen = false">
          <button @click="toggleNotificationPanel()" class="relative text-slate-400 hover:text-white transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            <template x-if="unreadNotificationCount > 0">
              <span class="pulse-badge absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-rose-500 text-xs font-bold text-white" x-text="unreadNotificationCount"></span>
            </template>
          </button>
          <div x-show="isNotificationPanelOpen" x-transition class="customer-notification-panel absolute top-full right-0 mt-2 w-80 bg-slate-800 border border-luxury-800 rounded-lg shadow-lg z-30 flex flex-col" style="display: none;">
            <div class="p-3 border-b border-slate-700 shrink-0 flex items-center justify-between">
              <h4 class="text-base font-bold text-white">Notifications</h4>
              <button type="button" @click="isNotificationPanelOpen = false" aria-label="Close notifications" class="notification-close">&times;</button>
            </div>
            <div class="notification-list overflow-y-auto flex-1" aria-live="polite">
              <template x-if="notifications.length === 0"><p class="text-xs text-slate-400 text-center p-8">You're all caught up. Booking updates will appear here.</p></template>
              <template x-for="notif in notifications" :key="notif.id || notif.time + notif.message">
                <article class="notification-card" :class="{ 'notification-unread': !notif.read }">
                  <div class="notification-status" :class="{ 'notification-status-cancelled': notif.type === 'CANCELLED' }" aria-hidden="true">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" :d="notif.icon"></path></svg>
                  </div>
                  <div class="notification-copy">
                    <div class="notification-title-row"><p class="notification-title" x-text="notificationDetails(notif).title"></p><span x-show="!notif.read" class="notification-dot" aria-label="Unread"></span></div>
                    <p class="notification-summary" x-show="notificationDetails(notif).summary" x-text="notificationDetails(notif).summary"></p>
                    <span class="notification-state-badge" x-show="notificationDetails(notif).status" x-text="notificationDetails(notif).status"></span>
                    <p class="notification-service" x-show="notificationDetails(notif).service" x-text="notificationDetails(notif).service"></p>
                    <p class="notification-branch" x-show="notificationDetails(notif).branch" x-text="notificationDetails(notif).branch"></p>
                    <p class="notification-schedule" x-show="notificationDetails(notif).schedule" x-text="notificationDetails(notif).schedule"></p>
                    <time class="notification-time" :datetime="notif.createdAt || ''" :title="notif.time" x-text="'Received ' + notificationTime(notif)"></time>
                  </div>
                </article>
              </template>
            </div>
            <div x-show="notifications.length > 0" class="p-2 border-t border-slate-700 shrink-0">
              <button type="button" @click="markAllNotificationsAsRead()" :disabled="unreadNotificationCount === 0" class="notification-read-all w-full text-center font-semibold">Mark all as read</button>
            </div>
          </div>

      <div x-show="isBooting" class="p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="h-28 rounded-2xl skeleton"></div>
          <div class="h-28 rounded-2xl skeleton"></div>
          <div class="h-28 rounded-2xl skeleton"></div>
        </div>
        <div class="h-64 rounded-2xl skeleton"></div>
      </div>

      <div x-show="!isBooting" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">

        <div class="p-6 space-y-6 pb-24 md:pb-6">
          <div class="services-content mx-auto">

            <div class="flex items-center justify-center gap-1.5 sm:gap-3 mb-4 flex-wrap" x-show="showBookingForm || showBookingSuccess || selectedServicesForBooking.length > 0">
              <template x-for="(label, i) in bookingProgressLabels()" :key="label">
                <div class="flex items-center gap-1.5 sm:gap-2">
                  <div class="w-6 h-6 sm:w-7 sm:h-7 rounded-full border flex items-center justify-center text-xs sm:text-xs font-bold transition-all duration-300"
                       :class="i === bookingProgressIndex() ? 'bg-gold-500 text-slate-950 border-gold-500 scale-110' : (i < bookingProgressIndex() ? 'bg-luxury-700 text-white border-luxury-700' : 'bg-slate-800 text-slate-500 border-slate-700')"
                       x-text="i + 1"></div>
                  <span class="text-xs sm:text-xs hidden sm:inline transition-colors duration-300" :class="i === bookingProgressIndex() ? 'text-white font-semibold' : 'text-slate-500'" x-text="label"></span>
                  <div x-show="i < bookingProgressLabels().length - 1" class="w-3 sm:w-8 h-px bg-slate-700"></div>
                </div>
              </template>
            </div>

            <div class="bg-slate-900 border border-luxury-900 rounded-2xl p-5 space-y-4">
              <h3 class="font-serif text-base font-bold text-white" x-text="showBookingForm ? 'Book an Appointment' : 'Explore Our Offerings'"></h3>
              <div class="service-branch-row" x-show="!showBookingForm && !showBookingSuccess">
                <label for="branch-select-services" class="text-xs text-slate-400">Select Branch:</label>
                <select id="branch-select-services" x-model="selectedBranchForServices" @change="clearBookingSelection(); resetServiceFilters(); prefillBookingForm()" class="bg-slate-950 text-slate-200 rounded-lg p-2 border border-slate-800 text-xs focus:outline-none focus:ring-1 focus:ring-purple-500">
                  <option value="daraga">Leo Mejillano Salon (Daraga)</option>
                  <option value="yashano">Skin Brows (Yashano)</option>
                  <option value="cabangan">Lash & Brows (Cabangan)</option>
                </select>
              </div>

              <p x-show="showBookingForm" class="text-xs text-slate-400"><strong>Branch:</strong> <span x-text="{'daraga':'Leo Mejillano Salon (Daraga)','yashano':'Skin Brows (Yashano)','cabangan':'Lash &amp; Brows (Cabangan)'}[selectedBranchForServices]"></span></p>
              <template x-if="!showBookingForm && !showBookingSuccess">
                <div>
                  <div class="space-y-3">
                    <h4 id="service-catalog-heading" tabindex="-1" class="font-serif text-base font-bold text-gold-400 mt-6">Services at <span x-text="selectedBranchForServices.charAt(0).toUpperCase() + selectedBranchForServices.slice(1)"></span></h4>
                    <div class="service-toolbar">
                      <div class="service-search-field">
                        <label for="service-search" class="text-xs font-bold">Search services</label>
                        <input id="service-search" type="search" x-model.debounce.200ms="serviceSearch" @input="servicePage = 1" placeholder="Search by service name" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs">
                      </div>
                      <div>
                        <label for="service-category" class="text-xs font-bold">Category</label>
                        <select id="service-category" x-model="serviceCategory" @change="servicePage = 1" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs">
                          <option value="">All categories</option>
                          <template x-for="category in serviceCategories()" :key="category"><option :value="category" x-text="category"></option></template>
                        </select>
                      </div>
                    </div>
                    <p class="text-xs text-slate-500" role="status" x-text="serviceResultLabel()"></p>
                    <div class="service-catalog-grid">
                      <template x-for="service in pagedServices()" :key="service.id">
                        <article class="service-catalog-card bg-slate-800 rounded-xl p-4" :class="{ 'service-card-selected': isSelectedForBooking(service) }">
                          <div class="service-card-heading">
                            <h5 class="font-bold text-white" x-text="service.name"></h5>
                            <p class="font-bold text-gold-400" x-text="formatPeso(service.price)"></p>
                          </div>
                          <div class="service-badges">
                            <span class="service-category-badge" :title="service.category" x-text="serviceCategoryLabel(service.category)"></span>
                            <span x-show="getPromoForService(service)" class="service-promo-badge">Promo available</span>
                          </div>

                        <ul class="list-disc pl-5 space-y-2 text-slate-400">
                          <li>Bookings need branch confirmation.</li>
                          <li>Pay the amount shown. Payment must be verified.</li>
                          <li>Deposits are non-refundable and carry over when rescheduled.</li>
                          <li>Reschedule online at least 24 hours before, or contact the branch. Subject to availability.</li>
                          <li>Cancelled or missed bookings can be rescheduled using the deposit.</li>
                        </ul>
                        <details class="text-slate-400 leading-relaxed">
                          <summary class="font-bold cursor-pointer py-2">Full terms</summary>

                          <ul class="list-disc list-inside space-y-1">
                            <li><strong class="text-slate-300">Reservation payment:</strong> A reservation payment is required to hold your appointment slot.</li>
                            <li><strong class="text-slate-300">50% or full payment:</strong> Depending on the service selected, you must pay either a 50% down payment or the full amount upfront — the required amount is shown before you book.</li>
                            <li><strong class="text-slate-300">Payment verification:</strong> Online payments (GCash, Maya or card) are processed securely by PayMongo; Cash must be settled in person. Your payment stays "Payment Being Verified" until staff confirm it — you can never verify your own payment.</li>
                            <li><strong class="text-slate-300">Confirmation rules:</strong> Your requested time is held as Waiting for Confirmation until the branch verifies your payment and confirms it — it is not guaranteed until confirmed.</li>
                            <li><strong class="text-slate-300">Deposit &amp; rescheduling policy:</strong> Reservation deposits are <u>non-refundable</u>. Need a different time? Reschedule instead (online up to 24 hours before, or by contacting the branch) and your deposit carries over. If you cancel or miss your appointment, the deposit is kept, but that booking can still be rescheduled later using the deposit.</li>
                            <li><strong class="text-slate-300">Rescheduling:</strong> You may request to reschedule; please do so as early as possible, subject to availability.</li>
                            <li><strong class="text-slate-300">No-show:</strong> Please arrive on time. Repeated no-shows or late cancellations may affect future bookings.</li>
                            <li>Prices and staff availability are confirmed by the branch and may change.</li>
                          </ul>
                        </details>
                        <label class="flex items-start gap-2 pt-1 text-slate-300 cursor-pointer">
                          <input type="checkbox" x-model="bookingForm.agreedToTerms" class="mt-0.5 accent-gold-500">
                          <span>I agree to the Terms &amp; Conditions.</span>
                        </label>
                      </div>
                    </template>

                    <p x-show="bookingError" x-text="bookingError" role="alert" class="text-rose-200 bg-rose-950 rounded-lg p-3"></p>

                          <p id="schedule-continue-hint" x-show="bookingStep === 'schedule' && scheduleContinueHint()" class="text-xs text-slate-500" role="status" x-text="scheduleContinueHint()"></p>
                    <div class="pt-2 flex flex-wrap gap-3 justify-between border-t border-slate-800">
                      <button type="button" @click="bookingStep === 'schedule' ? cancelBookingForm() : goToPreviousBookingStep()" :disabled="isSubmittingBooking" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition disabled:opacity-50" x-text="bookingStep === 'schedule' ? 'Back to services' : 'Back'"></button>

                      <button type="button" x-show="bookingStep === 'schedule'" @click="proceedFromSchedule()" :disabled="!canContinueSchedule()" :aria-busy="slotsLoading || staffAvailabilityLoading" aria-describedby="schedule-continue-hint" class="disabled:opacity-50 disabled:cursor-not-allowed px-5 py-2 bg-gradient-to-r from-luxury-600 to-luxury-800 text-white font-bold rounded-lg transition active:scale-95">Continue</button>
                      <button type="button" x-show="bookingStep === 'review'" @click="proceedFromReview()" :disabled="!bookingForm.customerName || !bookingForm.customerPhone" class="px-5 py-2 bg-gradient-to-r from-luxury-600 to-luxury-800 text-white font-bold rounded-lg transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">Continue to Payment</button>
                      <button type="button" x-show="bookingStep === 'payment' && !depositLocked" @click="proceedFromPayment()" class="px-5 py-2 bg-luxury-600 hover:bg-luxury-700 text-white font-bold rounded-lg transition active:scale-95" :disabled="reservationQuoteLoading || !reservationQuote || !bookingForm.paymentMethod">Continue</button>
                      <button type="button" x-show="bookingStep === 'payment' && depositLocked" @click="bookingStep = 'notifications'" class="px-5 py-2 bg-gradient-to-r from-luxury-600 to-luxury-800 text-white font-bold rounded-lg transition active:scale-95">Continue</button>
                      <button type="button" x-show="bookingStep === 'notifications'" @click="proceedFromNotifications()" class="px-5 py-2 bg-gradient-to-r from-luxury-600 to-luxury-800 text-white font-bold rounded-lg transition active:scale-95">Continue</button>
                      <button type="button" x-show="bookingStep === 'terms'" @click="submitBooking()" :aria-busy="isSubmittingBooking" :disabled="isSubmittingBooking || !bookingForm.agreedToTerms" class="px-5 py-2 bg-gradient-to-r from-gold-500 to-gold-600 text-slate-900 font-bold rounded-lg transition disabled:opacity-70 disabled:cursor-not-allowed flex items-center gap-2">
                        <svg x-show="isSubmittingBooking" class="animate-spin h-3.5 w-3.5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                        <span x-text="isSubmittingBooking ? 'Processing...' : (bookingForm.paymentMethod === 'PayMongo' &amp;&amp; requiredDeposit() > 0 ? 'Continue to Payment' : 'Submit Request')"></span>
                      </button>
                    </div>
                  </form>
                </div>
              </template>

              <template x-if="showBookingSuccess">
                <div class="pt-6 border-t border-slate-800 mt-6 space-y-4 text-center" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100">
                  <div class="w-16 h-16 bg-emerald-950 border-4 border-emerald-800 rounded-full flex items-center justify-center mx-auto">
                    <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                  </div>
                  <h4 class="font-serif text-lg font-bold text-white">Booking Request Received</h4>
                  <p class="text-slate-400 text-base">Your appointment request has been sent. You will receive a confirmation message shortly.</p>

                  <div x-show="bookingSuccessDetails" class="bg-slate-800 rounded-lg p-4 text-left text-xs my-4 space-y-2">
                    <p class="text-center font-bold text-gold-400 mb-3">Booking Reference: <span class="font-mono bg-slate-900 px-2 py-1 rounded" x-text="bookingSuccessDetails?.id"></span></p>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Branch:</strong><span class="text-white text-right" x-text="bookingSuccessDetails?.branchName"></span></div>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Service(s):</strong><span class="text-white text-right" x-text="bookingSuccessDetails?.serviceName"></span></div>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Date & Time:</strong><span class="text-white text-right" x-text="bookingSuccessDetails?.date + ' @ ' + bookingSuccessDetails?.time"></span></div>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Estimated Duration:</strong><span class="text-white" x-text="ServiceDuration.format(bookingSuccessDetails?.durationMinutes)"></span></div>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Estimated End Time:</strong><span class="text-white" x-text="bookingSuccessDetails?.endTime"></span></div>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Staff:</strong><span class="text-white text-right" x-text="bookingSuccessDetails?.staffName"></span></div>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Pay Now:</strong><span class="text-white text-right" x-text="formatPeso(bookingSuccessDetails?.depositAmount) + ' via ' + bookingSuccessDetails?.paymentMethod + (bookingSuccessDetails?.depositReference ? ' (Ref: ' + bookingSuccessDetails.depositReference + ')' : '')"></span></div>
                    <div class="flex justify-between items-center"><strong class="text-slate-500">Balance to Pay Later:</strong><span class="text-white" x-text="formatPeso(bookingSuccessDetails?.remainingBalance)"></span></div>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-700"><strong class="text-slate-500">Service Total:</strong><span class="font-bold text-gold-400" x-text="formatPeso(bookingSuccessDetails?.price)"></span></div>
                  </div>

                  <div class="flex flex-col sm:flex-row justify-center gap-2 sm:gap-3">
                    <button @click="closeBookingSection()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition active:scale-95">Book Another Service</button>
                    <a href="appointments.html" class="px-5 py-2 bg-gradient-to-r from-luxury-600 to-luxury-800 text-white font-bold rounded-lg hover:shadow-lg hover:shadow-luxury-600/20 transition active:scale-95">View My Appointments</a>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
