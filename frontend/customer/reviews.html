<!doctype html>
<html lang="en">

<head>
  <link rel="stylesheet" href="../shared/theme-tokens.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leo Mejillano Salon - My Reviews</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            luxury: {
              50: "#EEF7F2",
              100: "#DDF0E6",
              200: "#DDF0E6",
              500: "#16604B",
              600: "#16604B",
              700: "#0E3B2F",
              800: "#0E3B2F",
              900: "#0E3B2F",
              950: "#F6F8F7",
            },
            gold: {
              100: "#FAF2DC",
              400: "#E0B84C",
              500: "#E0B84C",
              600: "#E0B84C",
            },
          },
        },
      },
    };
  </script>

  <style>
    [x-cloak] {
      display: none !important;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--brand);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--brand-dark);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stagger-item {
      animation: fadeUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    .skeleton {
      background: linear-gradient(90deg,
          var(--bg) 25%,
          var(--border) 37%,
          var(--bg) 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }

    @keyframes gentlePulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.18);
      }
    }

    .pulse-badge {
      animation: gentlePulse 1.6s ease-in-out infinite;
    }

    @keyframes topbarShine {
      0% {
        background-position: 0% 50%;
      }

      100% {
        background-position: 200% 50%;
      }
    }

    .topbar-shine {
      background-size: 200% 100%;
      animation: topbarShine 7s linear infinite;
    }

    .card-lift {
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .card-lift:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -8px rgba(22, 96, 75, 0.35);
    }
  </style>
  <link rel="stylesheet" href="../../frontend/customer/customer-theme.css?v=20261104-notif2">
  <script src="../../function/customer/theme-config.js"></script>
  <link rel="stylesheet" href="../../frontend/shared/responsive-base.css?v=20261103b" />
  <link rel="stylesheet" href="../../frontend/shared/portal-colors.css?v=20261103-signout-cream" />
  <script src="../../function/shared/toast.js"></script>
  <script src="../../function/shared/portal-presentation.js"></script>
  <!-- Clean theme: loaded last so it overrides older theme colours. -->
  <link rel="stylesheet" href="../../frontend/shared/clean-theme.css?v=20261104-notif4">
  <!-- Customer portal shell (sidebar, header, bottom nav); loaded after the shared themes. -->
  <link rel="stylesheet" href="../../frontend/customer/customer-portal.css?v=20261110">
  <link rel="stylesheet" href="../shared/type-scale.css?v=20261110-size">
</head>

<body data-customer-page="reviews" data-page-title="My Feedback"
  class="salon-portal bg-luxury-950 text-slate-100 font-sans min-h-screen antialiased selection:bg-luxury-500 selection:text-white"
  x-data="customerApp()" x-init="init()" x-cloak>


  <div class="flex h-screen overflow-hidden flex-col md:flex-row">
    <div data-customer-shell="sidebar"></div>

    <main class="flex-1 flex flex-col bg-slate-950 overflow-y-auto">
      <div data-customer-shell="header"></div>

      <div x-show="isBooting" class="p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="h-28 rounded-2xl skeleton"></div>
          <div class="h-28 rounded-2xl skeleton"></div>
          <div class="h-28 rounded-2xl skeleton"></div>
        </div>
        <div class="h-64 rounded-2xl skeleton"></div>
      </div>

      <div x-show="!isBooting" x-transition:enter="transition ease-out duration-500"
        x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
        <div class="p-6 space-y-6 pb-24 md:pb-6">
          <div data-customer-shell="intro" data-eyebrow="WE'D LOVE TO HEAR FROM YOU" data-title="Share your" data-accent="experience" data-text="Your feedback helps every visit feel a little better."></div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-if="myReviews.length === 0">
              <section class="reviews-empty-state col-span-full bg-slate-900 border border-luxury-900 rounded-2xl" aria-labelledby="reviews-empty-title">
                <div class="reviews-empty-icon" aria-hidden="true">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="m12 3 2.78 5.63L21 9.54l-4.5 4.39 1.06 6.2L12 17.2l-5.56 2.93 1.06-6.2L3 9.54l6.22-.91L12 3Z"/></svg>
                </div>
                <h3 id="reviews-empty-title" class="font-bold text-white">No reviews yet</h3>
                <p class="text-xs text-slate-500" x-text="reviewableAppointments().length ? 'Share your experience from your recent appointment below.' : 'You can leave a review after completing an appointment.'"></p>
                <a x-show="!reviewableAppointments().length" href="appointments.html" class="reviews-primary-action">View My Appointments</a>
              </section>
            </template>
            <section x-show="reviewableAppointments().length > 0" class="col-span-full space-y-3" aria-labelledby="reviewable-heading">
              <h3 id="reviewable-heading" class="font-bold text-white">Ready to review</h3>
              <div class="reviews-eligible-grid">
                <template x-for="appointment in reviewableAppointments()" :key="appointment.id">
                  <article class="reviews-eligible-card bg-slate-900 border border-luxury-900 rounded-xl p-4">
                    <div class="min-w-0">
                      <h4 class="font-bold text-white" x-text="appointment.serviceName"></h4>
                      <p class="text-xs text-slate-500" x-text="appointment.branchName"></p>
                      <p class="text-xs text-slate-500 mt-1" x-text="formatApptDateLong(appointment.date)"></p>
                    </div>
                    <button type="button" @click="openReviewModal(appointment)" class="reviews-primary-action">Leave Review</button>
                  </article>
                </template>
              </div>
            </section>
            <template x-for="(review, i) in myReviews" :key="review.id">
              <div
                class="card-lift stagger-item bg-slate-900 border border-luxury-900 rounded-2xl p-5 space-y-4 flex flex-col"
                :style="'animation-delay:' + (i * 70) + 'ms'">
                <div class="flex-1">
                  <div class="flex justify-between items-start">
                    <div>
                      <p class="font-bold text-base text-white" x-text="review.serviceName"></p>
                      <p class="text-xs text-purple-300" x-text="review.branchName"></p>
                    </div>
                    <div class="flex items-center space-x-1 text-gold-400" :aria-label="review.rating + ' out of 5 stars'">
                      <span class="text-xs font-bold" x-text="review.rating"></span>
                      <span>&#9733;</span>
                    </div>
                  </div>
                  <div
                    class="mt-3 text-xs text-slate-300 bg-slate-950/50 p-3 rounded-lg border border-slate-800 ">
                    <p x-text="review.comment ? `&quot;${review.comment}&quot;` : 'No comment provided.'"></p>
                  </div>
                </div>
                <div
                  class="text-xs text-slate-500 border-t border-slate-800 pt-3 mt-3 flex justify-between items-end">
                  <div>
                    <p>
                      <strong>Stylist:</strong>
                      <span class="font-medium text-slate-400" x-text="review.staffName"></span>
                    </p>
                    <p>
                      <strong>Date Submitted:</strong>
                      <span class="font-medium text-slate-400"
                        x-text="new Date(review.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })"></span>
                    </p>
                  </div>
                  <button @click="openEditReviewModal(review)" class="text-purple-400 hover:underline font-semibold">
                    Edit
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
      <div data-customer-shell="footer"></div>
    </main>
  </div>

  <div data-customer-shell="bottom-nav"></div>
  <div data-customer-shell="signout"></div>

  <div x-show="isReviewModalOpen" x-transition.opacity
    class="fixed inset-0 z-[9998] flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4"
    style="display: none">
    <div x-show="isReviewModalOpen" x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
      @click.outside="closeReviewModal()"
      class="bg-slate-900 border border-luxury-800 rounded-2xl max-w-md w-full p-6 space-y-5">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-serif font-bold text-white"
          x-text="isEditingReview ? 'Edit Your Review' : 'Leave a Review'"></h3>
        <button @click="closeReviewModal()" class="text-slate-400 hover:text-white">
          &times;
        </button>
      </div>

      <form @submit.prevent="submitReview()" class="space-y-4 text-xs">
        <p class="text-slate-400">
          How was your experience for
          <strong class="text-white" x-text="reviewForm.serviceName"></strong>
          with
          <strong class="text-white" x-text="reviewForm.staffName"></strong>?
        </p>

        <div>
          <label class="block text-slate-400 mb-1">Rating</label>
          <div class="flex items-center gap-1 text-slate-600">
            <template x-for="star in [1, 2, 3, 4, 5]" :key="star">
              <button type="button" @click="reviewForm.rating = Number(reviewForm.rating) === star ? star - 1 : star"
                :aria-label="star + ' out of 5 stars'" :aria-pressed="reviewForm.rating >= star"
                :class="reviewForm.rating >= star ? 'text-gold-400' : 'hover:text-gold-500'"
                class="flex flex-1 items-center justify-center min-w-0 cursor-pointer rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2"
                style="font-size: clamp(48px, 12vw, 64px); line-height: 1.2; min-height: 64px; touch-action: manipulation; transition: none;">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display: block; width: 56px !important; height: 56px !important; min-width: 40px; flex-shrink: 0;">
                  <path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2Z"/>
                </svg>
              </button>
            </template>
          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1">Your Feedback (Optional)</label>
          <textarea x-model="reviewForm.comment" rows="4" placeholder="Tell us more about your experience..."
            class="w-full bg-slate-950 text-slate-200 rounded-lg p-2.5 border border-slate-800 focus:outline-none focus:ring-1 focus:ring-purple-500"></textarea>
        </div>

        <div class="pt-2 flex justify-end space-x-3 border-t border-slate-800">
          <button type="button" @click="closeReviewModal()"
            class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition">
            Cancel
          </button>
          <button type="submit"
            class="px-5 py-2 bg-gradient-to-r from-gold-500 to-gold-600 text-slate-900 font-bold rounded-lg transition active:scale-95"
            x-text="isEditingReview ? 'Save Changes' : 'Submit Review'"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- App logic, split by concern. Only what this page's markup uses:
       the reviews list and edit-review modal. Appointments, booking,
       home service, and profile mixins live on their own pages. -->
  <script src="../../function/customer/customer-shell.js?v=20261110"></script>
  <script src="../../function/customer/dashboard-helpers.js"></script>
  <script src="../../function/customer/dashboard-state.js"></script>
  <script src="../../function/customer/dashboard-notifications.js"></script>
  <script src="../../function/customer/dashboard-reviews.js"></script>
  <script src="../../function/shared/live-sync.js?v=20261110"></script>
  <script src="../../function/customer/dashboard.js"></script>
</body>

</html>
