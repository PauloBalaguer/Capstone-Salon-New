<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leo Mejillano Salon - Staff Portal | My Assignments</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>


  <style>
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #059669; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #10b981; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .stagger-item { animation: fadeUp .45s cubic-bezier(.16,1,.3,1) both; }

    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .skeleton { background: linear-gradient(90deg, #0f172a 25%, #16302a 37%, #0f172a 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }

    @keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: 0.55; } }
    .pulse-dot { animation: pulseDot 1.6s ease-in-out infinite; }

    @keyframes topbarShine { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    .topbar-shine { background-size: 200% 100%; animation: topbarShine 7s linear infinite; }

    @keyframes shiftPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(244,63,94,0.35);} 50% { box-shadow: 0 0 0 8px rgba(244,63,94,0);} }
    .shift-glow { animation: shiftPulse 2.2s ease-in-out infinite; }

    .detail-panel { transition: grid-template-rows .35s ease; display: grid; grid-template-rows: 0fr; }
    .detail-panel.is-open { grid-template-rows: 1fr; }
    .detail-panel > div { overflow: hidden; }

    .tab-btn { transition: all .2s ease; }
  </style>
  <link rel="stylesheet" href="../../frontend/staff/staff-theme.css?v=20261104-modal-backdrop">
  <link rel="stylesheet" href="../../frontend/shared/responsive-base.css?v=20261103b" />
  <link rel="stylesheet" href="../../frontend/shared/portal-colors.css?v=20261103-signout-cream" />
  <script src="../../function/shared/toast.js"></script>
  <script src="../../function/shared/confirm-dialog.js"></script>
  <script src="../../function/shared/portal-presentation.js"></script>
  <!-- Clean theme: loaded last so it overrides older theme colours. -->
  <link rel="stylesheet" href="../../frontend/shared/clean-theme.css?v=20261104-notif4">
</head>
<body class="salon-portal bg-slate-950 text-slate-100 font-sans min-h-screen antialiased selection:bg-emerald-500 selection:text-white"
      x-data="staffAppointmentsApp()" x-init="init()" x-cloak>

  <div class="h-1.5 w-full bg-gradient-to-r from-emerald-600 via-teal-500 to-emerald-800 topbar-shine"></div>


  <div class="flex h-screen overflow-hidden flex-col md:flex-row">

    <aside class="hidden md:flex md:w-64 bg-slate-900 border-r border-emerald-900/40 flex-col justify-between shrink-0 h-full z-20">
      <div class="p-5">
        <div class="staff-profile-card flex items-center space-x-3 mb-8">
          <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center font-serif text-white font-bold text-lg shadow-lg shadow-emerald-500/20 overflow-hidden shrink-0"><img x-show="$store.staff.profile.profilePicture" :src="$store.staff.profile.profilePicture" class="w-full h-full object-cover" alt=""><span x-show="!$store.staff.profile.profilePicture" x-text="$store.staff.initials()"></span></div>
          <div class="min-w-0">
            <h1 class="text-base font-bold text-emerald-400 font-serif break-words" x-text="$store.staff.profile.name || 'Staff'"></h1>
            <p class="text-xs text-slate-400 uppercase tracking-widest font-sans" >Staff Portal</p>
          </div>
        </div>

        <nav class="space-y-1.5">
          <a href="dashboard.html" data-nav-page="dashboard.html" class="text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 w-full text-left flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-xs transition duration-150">
            <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"></path></svg>
            <span>Dashboard</span>
          </a>
          <a href="assignedAppointments.html" data-nav-page="assignedAppointments.html" class="w-full text-left flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-xs transition duration-150">
            <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span>My Assignments</span>
          </a>
          <a href="inventory.html" data-nav-page="inventory.html" class="text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 w-full text-left flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-xs transition duration-150">
            <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 11m8 4V4m0 11V18"></path></svg>
            <span>Supplies & Usage</span>
          </a>
          <a href="attendance.html" data-nav-page="attendance.html" class="text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 w-full text-left flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-xs transition duration-150">
            <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Attendance</span>
          </a>
          <a href="profile.html" data-nav-page="profile.html" class="text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 w-full text-left flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-xs transition duration-150">
            <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span>Profile</span>
          </a>
        </nav>
      </div>

      <div>
        <div class="p-4 border-t border-slate-800">
          <a href="../../backend/auth/logout.php?portal=staff" class="w-full text-left flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-xs transition duration-150 text-rose-400 hover:bg-rose-900/50 hover:text-rose-300"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H5v14h4M13 8l4 4-4 4M9 12h12"/></svg><span>Sign Out</span></a>
        </div>
      </div>
    </aside>

    <main class="flex-1 flex flex-col h-full bg-slate-950 overflow-y-auto">

      <div class="md:hidden px-5 pt-5 pb-2 flex items-center justify-between">
        <div>
          <p class="text-lg font-bold text-white">My Assignments</p>
          <p class="text-xs text-slate-400">Prepare, perform, and update status.</p>
        </div>
        <a href="profile.html" class="relative w-11 h-11 rounded-full flex items-center justify-center font-bold text-white text-base shadow-lg"
                :class="$store.staff.isClockedIn() ? 'bg-gradient-to-tr from-emerald-500 to-teal-500 shift-glow' : 'bg-gradient-to-tr from-slate-600 to-slate-700'">
          <span x-text="$store.staff.initials()"></span>
          <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full border-2 border-slate-950" :class="$store.staff.isClockedIn() ? 'bg-emerald-400 pulse-dot' : 'bg-slate-500'"></span>
        </a>
      </div>

      <header class="hidden md:flex bg-slate-900 border-b border-emerald-900/40 px-6 py-4 shrink-0 items-center justify-between flex-wrap gap-4">
        <div>
          <h2 class="text-lg font-serif font-bold text-white">My Assignments</h2>
          <p class="text-xs text-slate-400">Prepare, perform, and update status for every booking assigned to you.</p>
        </div>

        <div class="flex items-center gap-4">
          <div class="text-right">
            <p class="text-xs uppercase tracking-wider text-slate-500">Status</p>
            <p class="text-base font-bold" :class="$store.staff.isClockedIn() ? 'text-emerald-400' : 'text-slate-500'" x-text="$store.staff.isClockedIn() ? 'On Shift • ' + $store.staff.getShiftDurationLabel() : 'Off Shift'"></p>
          </div>
          <div class="relative" @click.outside="$store.staff.isNotificationPanelOpen = false">
            <button @click="$store.staff.toggleNotificationPanel()" class="relative text-slate-400 hover:text-white transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
              <template x-if="$store.staff.unreadNotificationCount() > 0">
                <span class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-rose-500 text-xs font-bold text-white" x-text="$store.staff.unreadNotificationCount()"></span>
              </template>
            </button>
            <div x-show="$store.staff.isNotificationPanelOpen" x-transition role="region" aria-label="Staff notifications" class="portal-notification-panel absolute top-full right-0 mt-2 w-80 bg-slate-800 border border-slate-700 rounded-lg shadow-lg z-30 flex flex-col max-h-96" style="display:none">
              <div class="lm-notif-head p-3 border-b border-slate-700 shrink-0"><h4 class="text-base font-bold text-white">Notifications</h4><button type="button" class="lm-notif-readall" x-show="$store.staff.notifications.length > 0" @click="$store.staff.markAllNotificationsAsRead()" :disabled="$store.staff.unreadNotificationCount() === 0">Mark all as read</button></div>
              <div class="divide-y divide-slate-700 overflow-y-auto flex-1">
                <template x-if="$store.staff.notifications.length === 0"><p class="text-xs text-slate-400 text-center p-8">No notifications yet.</p></template>
                <template x-for="notif in $store.staff.notifications" :key="notif.id">
                  <div class="portal-notification-card p-3 hover:bg-slate-700/40" :class="{ 'portal-notification-unread': !notif.isRead }">
                    <div class="lm-notif-title"><strong x-text="PortalPresentation.notificationTitle(notif.type)"></strong><span x-show="!notif.isRead" class="lm-notif-dot" role="img" aria-label="Unread"></span><time class="lm-notif-time" x-text="PortalPresentation.shortTime(notif)"></time></div>
                    <p class="portal-notification-message text-xs text-slate-200" x-text="PortalPresentation.notificationDetails(notif).summary"></p>
                    <span class="notification-state-badge" x-show="PortalPresentation.notificationDetails(notif).status" x-text="PortalPresentation.notificationDetails(notif).status"></span>
                    <p class="lm-notif-line" x-text="PortalPresentation.noticeLine([PortalPresentation.notificationDetails(notif).service, PortalPresentation.notificationDetails(notif).branch, PortalPresentation.notificationDetails(notif).schedule])"></p>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </header>

      <div class="p-6 pb-28 md:pb-6 space-y-5">

        <div class="flex items-center justify-between flex-wrap gap-3">
          <div class="w-full sm:w-auto grid grid-cols-4 sm:flex items-center gap-1 bg-slate-900 border border-slate-800 rounded-xl p-1">
            <template x-for="tab in [['today','Today'],['upcoming','Upcoming'],['completed','Completed'],['all','All']]" :key="tab[0]">
              <button @click="filterTab = tab[0]; searchQuery = ''" class="tab-btn min-h-10 px-2 sm:px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap"
                :class="filterTab === tab[0] && !searchQuery.trim() ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'"
                x-text="tab[1]"></button>
            </template>
          </div>
          <div class="relative w-full sm:w-80">
            <svg aria-hidden="true" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"></path></svg>
            <input type="search" x-model="searchQuery" placeholder="Search client or reference" aria-label="Search all assignments by client or booking reference"
                   style="padding-left:2.5rem !important" class="bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 h-11 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 w-full transition-all duration-200 focus:-translate-y-0.5">
          </div>
        </div>

        <div class="space-y-3">
          <template x-if="$store.staff.loading">
            <template x-for="i in 4" :key="i"><div class="skeleton rounded-xl h-20 border border-slate-800"></div></template>
          </template>

          <template x-if="!$store.staff.loading && filteredAppointments().length === 0">
            <div class="text-center py-16 text-slate-500 text-xs  bg-slate-900 border border-slate-800 rounded-2xl" x-text="searchQuery.trim() ? 'No bookings match your search.' : 'Nothing here yet.'"></div>
          </template>

          <div x-show="!$store.staff.loading && filteredAppointments().length > 0" aria-hidden="true" class="hidden md:grid grid-cols-[7.5rem_6rem_minmax(0,1fr)_minmax(0,1fr)_15rem] gap-x-4 pl-4 pr-11 text-xs font-bold text-slate-500">
            <span>Date</span><span>Time</span><span>Client</span><span>Service</span><span class="text-right">Status</span>
          </div>

          <template x-for="(appt, idx) in pagedAppointments()" :key="appt.id">
            <div class="stagger-item bg-slate-900 border border-slate-800 hover:border-emerald-700 rounded-xl transition-colors duration-200 overflow-hidden" :style="'animation-delay: ' + Math.min(idx * 35, 300) + 'ms'">
              <button @click="toggleExpand(appt.id)" class="w-full text-left p-4 flex items-center justify-between gap-3 flex-wrap">
                <div class="flex-1 min-w-0 grid grid-cols-1 md:grid-cols-[7.5rem_6rem_minmax(0,1fr)_minmax(0,1fr)_15rem] md:items-center gap-x-4 gap-y-1">
                  <p class="text-xs font-semibold text-slate-300"><span class="md:hidden font-normal text-slate-500">Date: </span><span x-text="$store.staff.formatDate(appt.date)"></span></p>
                  <p class="text-xs font-semibold text-slate-300"><span class="md:hidden font-normal text-slate-500">Time: </span><span x-text="appt.time"></span></p>
                  <p class="text-base font-bold text-white truncate"><span class="md:hidden text-xs font-normal text-slate-500">Client: </span><span x-text="appt.clientName"></span></p>
                  <div class="min-w-0">
                    <p class="text-xs text-slate-400 truncate"><span class="md:hidden text-slate-500">Service: </span><span x-text="appt.serviceName"></span></p>
                    <p x-show="appt.otherStylists" class="text-xs text-slate-500 truncate" x-text="'Shared with ' + appt.otherStylists"></p>
                  </div>
                  <div class="flex items-center gap-1.5 flex-wrap md:justify-end">
                    <span :class="$store.staff.getStatusBadgeClass(appt.status)" class="px-2 py-0.5 rounded-full text-xs font-bold whitespace-nowrap" x-text="appt.status"></span>
                    <span x-show="$store.staff.isLate(appt)" :class="$store.staff.lateBadgeClass(appt)" class="px-2 py-0.5 rounded-full text-xs font-bold whitespace-nowrap" x-text="$store.staff.lateLabel(appt)"></span>
                  </div>
                </div>
                <div class="flex items-center gap-3">
                  <svg class="w-4 h-4 text-slate-500 transition-transform duration-300" :class="expandedId === appt.id ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
              </button>

              <div class="detail-panel" :class="expandedId === appt.id ? 'is-open' : ''">
                <div>
                  <div class="px-4 pb-4 pt-1 border-t border-slate-800 space-y-4">

                    <ol x-show="$store.staff.progressSteps(appt).length" aria-label="Service progress" class="flex items-center flex-wrap gap-1.5 pt-2">
                      <template x-for="(step, i) in $store.staff.progressSteps(appt)" :key="step.label">
                        <li class="flex items-center gap-1.5">
                          <span x-show="i > 0" aria-hidden="true" class="text-[#94A3B8]">&rarr;</span>
                          <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border" :aria-current="step.active ? 'step' : null" :class="step.active ? 'bg-[#006D6F] text-white border-[#006D6F]' : step.done ? 'bg-[#DCFCE7] text-[#166534] border-[#86EFAC]' : 'bg-[#F1F5F9] text-[#475569] border-[#CBD5E1]'" x-text="step.label"></span>
                        </li>
                      </template>
                    </ol>

                    <p x-show="$store.staff.isMissed(appt)" class="pt-2 text-xs font-semibold" style="color:#B91C1C">The customer missed this appointment. Send a request to the front desk.</p>

                    <div class="flex items-center gap-2 flex-wrap">
                      <button x-show="$store.staff.canStart(appt)" @click="$store.staff.startService(appt.id)" :disabled="$store.staff.busy"
                        class="px-4 py-2 rounded-lg text-xs font-bold uppercase bg-teal-600 hover:bg-teal-700 text-white transition-all active:scale-95 disabled:opacity-50" style="color:#FFFFFF !important;border-radius:10px !important;min-height:44px">Start Service</button>
                      <button x-show="$store.staff.canComplete(appt)" @click="$store.staff.completeService(appt.id)" :disabled="$store.staff.busy"
                        class="px-4 py-2 rounded-lg text-xs font-bold uppercase bg-emerald-600 hover:bg-emerald-700 text-white transition-all active:scale-95 disabled:opacity-50" style="color:#FFFFFF !important;border-radius:10px !important;min-height:44px">Complete Service</button>
                      <button x-show="$store.staff.isBeyondGrace(appt) && !$store.staff.hasArrivalRequest(appt, 'no_show')" @click="$store.staff.requestArrivalHelp(appt.id, 'no_show')" :disabled="$store.staff.busy"
                        class="px-4 py-2 rounded-lg text-xs font-bold uppercase bg-[#B91C1C] hover:bg-[#991B1B] text-white transition-all active:scale-95 disabled:opacity-50" style="color:#FFFFFF !important;border-radius:10px !important;min-height:44px">Request No-Show</button>
                      <button x-show="$store.staff.isLate(appt) && !$store.staff.hasArrivalRequest(appt, 'reschedule')" @click="$store.staff.requestArrivalHelp(appt.id, 'reschedule')" :disabled="$store.staff.busy"
                        class="px-4 py-2 rounded-lg text-xs font-bold uppercase bg-[#006D6F] hover:bg-[#06464A] text-white transition-all active:scale-95 disabled:opacity-50" style="color:#FFFFFF !important;border-radius:10px !important;min-height:44px">Request Reschedule</button>
                      <span x-show="appt.status === 'Confirmed' && $store.staff.hasArrivalRequest(appt, 'no_show')" class="text-xs font-semibold text-[#B91C1C]">No-show request sent. Waiting for the front desk.</span>
                      <span x-show="appt.status === 'Confirmed' && $store.staff.hasArrivalRequest(appt, 'reschedule')" class="text-xs font-semibold text-[#06464A]">Reschedule request sent. Waiting for the front desk.</span>
                      <span x-show="appt.status === 'Pending'" class="text-xs text-slate-500 ">Waiting for admin/cashier confirmation.</span>
                      <span x-show="appt.isMainStylist === false && ['Confirmed', 'In Progress'].includes(appt.status)" class="text-xs text-slate-500 ">Shared booking -- you do the service(s) above; the main stylist starts and completes it.</span>
                      <span x-show="appt.status === 'Confirmed' && appt.date > new Date().toLocaleDateString('en-CA')" class="text-xs text-slate-500 ">Scheduled for a later date -- you can start it on the day itself.</span>
                      <span x-show="appt.status === 'Reschedule Requested'" class="text-xs text-slate-500 ">Waiting for a new schedule, the salon or client is moving this booking.</span>
                      <span x-show="['Completed', 'Cancelled', 'Reviewed', 'No-Show'].includes(appt.status)" class="text-xs text-slate-500 ">No further action needed.</span>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-xs">
                      <div><span class="text-slate-500 block">Contact</span><span class="text-slate-200 font-medium" x-text="appt.clientPhone || ''"></span></div>
                      <div><span class="text-slate-500 block">End Time</span><span class="text-slate-200 font-medium" x-text="appt.endTime"></span></div>
                      <div><span class="text-slate-500 block">Duration</span><span class="text-slate-200 font-medium" x-text="appt.durationMinutes + ' min'"></span></div>
                      <div><span class="text-slate-500 block">Total</span><span class="text-slate-200 font-medium" x-text="$store.staff.formatCurrency(appt.price)"></span></div>
                      <div><span class="text-slate-500 block">Booking Reference</span><span class="text-slate-200 font-medium break-all" x-text="appt.id"></span></div>
                    </div>

                    <div x-show="['In Progress', 'Completed', 'Reviewed'].includes(appt.status)" class="bg-[#F7F1E6] border border-[#E4D7C0] rounded-xl p-3.5 space-y-2.5">
                      <h4 class="text-xs font-bold text-[#1F2937] uppercase tracking-wide flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-[#006D6F]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 11m8 4V4m0 11V18"></path></svg>
                        Log Supplies Used For This Service
                      </h4>
                      <p class="text-xs text-[#6B7280] -mt-1">Pick each product you used and how many, it's deducted from branch stock.</p>
                      <div class="flex items-center gap-2 flex-wrap">
                        <div class="flex-1 min-w-[10rem]" @click.outside="if (expandedId === appt.id) supplyOpen = false" @keydown.escape="supplyOpen = false">
                          <input type="search" x-model="supplySearch" @focus="supplyOpen = true; $nextTick(() => $el.parentElement.scrollIntoView({ block: 'nearest' }))" @input="supplyForm.itemId = ''; supplyOpen = true" placeholder="Search item..." aria-label="Search supply item"
                                 class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                          <p x-show="selectedSupply() && !supplyOpen" class="mt-1 text-xs" :class="selectedSupply() && supplyIsLow(selectedSupply()) ? 'font-bold' : 'text-slate-500'" :style="selectedSupply() && supplyIsLow(selectedSupply()) ? 'color:#92400E' : ''" x-text="selectedSupply() ? selectedSupply().name + ', ' + supplyStockLabel(selectedSupply()) : ''"></p>
                          <div x-show="supplyOpen && expandedId === appt.id" class="mt-1 max-h-48 overflow-y-auto bg-slate-900 border border-slate-700 rounded-lg">
                            <template x-for="item in supplyOptions()" :key="item.id">
                              <button type="button" @click="chooseSupply(item)" :disabled="item.stock <= 0"
                                      :aria-current="supplyForm.itemId === item.id ? 'true' : null"
                                      :style="supplyForm.itemId === item.id ? 'background:#E5F2F0;min-height:36px !important' : 'min-height:36px !important'"
                                      class="w-full flex items-center justify-between gap-3 px-2.5 py-1 text-left text-xs text-slate-200 hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed">
                                <span class="flex items-center gap-1.5 min-w-0">
                                  <span x-show="supplyForm.itemId === item.id" aria-hidden="true" class="font-bold" style="color:#006D6F">&#10003;</span>
                                  <span x-text="item.name"></span>
                                </span>
                                <span class="shrink-0" :class="supplyIsLow(item) ? 'font-bold' : 'font-medium text-slate-500'" :style="supplyIsLow(item) ? 'color:#92400E' : ''" x-text="supplyStockLabel(item)"></span>
                              </button>
                            </template>
                            <p x-show="supplyOptions().length === 0" class="px-2.5 py-3 text-center text-xs text-slate-500">No matching item.</p>
                          </div>
                        </div>
                        <input type="number" min="1" x-model.number="supplyForm.quantity" placeholder="Qty"
                               class="w-20 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <button @click="logSupplyForAppointment(appt.id)" :disabled="$store.staff.busy || !supplyForm.itemId || !supplyForm.quantity"
                                class="px-4 py-1.5 rounded-lg text-xs font-bold uppercase bg-[#006D6F] hover:bg-[#06464A] text-white transition-all active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed">Log Usage</button>
                      </div>
                    </div>

                  </div>
                </div>
              </div>
            </div>
          </template>

          <nav x-show="!$store.staff.loading && totalPages() > 1" aria-label="Assignment pages" class="flex items-center justify-between flex-wrap gap-3 pt-2">
            <p class="text-xs text-slate-400" x-text="pageLabel()"></p>
            <div class="flex items-center gap-2">
              <button type="button" @click="page = currentPage() - 1" :disabled="currentPage() <= 1" class="min-h-10 px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 border border-slate-800 text-slate-200 disabled:opacity-40 disabled:cursor-not-allowed">Previous</button>
              <span class="text-xs text-slate-400" x-text="'Page ' + currentPage() + ' of ' + totalPages()"></span>
              <button type="button" @click="page = currentPage() + 1" :disabled="currentPage() >= totalPages()" class="min-h-10 px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 border border-slate-800 text-slate-200 disabled:opacity-40 disabled:cursor-not-allowed">Next</button>
            </div>
          </nav>
        </div>

      </div>
    </main>
  </div>

      </a>

        <svg style="width:1.1rem;height:1.1rem" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
      </a>
      <a href="inventory.html" data-mobile-nav-page="inventory.html" class="relative z-10 w-11 h-11 flex items-center justify-center rounded-full text-slate-400 transition-colors duration-200">
        <svg style="width:1.1rem;height:1.1rem" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 11m8 4V4m0 11V18"></path></svg>

      <a href="attendance.html" data-mobile-nav-page="attendance.html" class="relative z-10 w-11 h-11 flex items-center justify-center rounded-full text-slate-400 transition-colors duration-200">

      <a href="profile.html" data-mobile-nav-page="profile.html" class="relative z-10 w-11 h-11 flex items-center justify-center rounded-full text-slate-400 transition-colors duration-200">

      </a>

  </nav>

</body>
