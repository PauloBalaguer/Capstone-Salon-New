# Apache site for the container. Replaces .htaccess there (AllowOverride None).
#
# The browser-facing URLs stay the same as on XAMPP, but only the folders named
# below are reachable. vendor/, backend/shared/ and the code root have no URL at all.

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Limits PHP processes, and so database connections, per container instance.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 5
    MaxRequestWorkers 20
</IfModule>

<VirtualHost *:${PORT}>
    DocumentRoot "${SALON_PUBLIC}"
    DirectoryIndex index.html

    AliasMatch "^/(frontend|function)(/.*)?$" "${SALON_APP}/$1$2"
    AliasMatch "^/backend/(account|admin|auth|cashier|customer|public|staff)(/.*)?$" "${SALON_APP}/backend/$1$2"

    # Only Vercel's proxy can reach the container and it sets these two headers,
    # so PHP sees the visitor's address (rate limits, audit log) and real HTTPS.
    # Each pair of ranges means "any address": Apache refuses a /0 mask.
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 0.0.0.0/1 128.0.0.0/1
    RemoteIPTrustedProxy ::/1 8000::/1
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    # Images, icons and videos on Cloudinary. Off until the CLOUDINARY_CLOUD_NAME
    # environment variable is set; upload the files first with
    # database/scripts/cloudinary_upload_media.php. Requests for
    # frontend/shared/{image,icon,video}/... are then sent to the same path on
    # Cloudinary (images in the best format and size for each browser), and
    # Vercel's CDN keeps the redirect, so this container answers each file once.
    # Remove the variable and redeploy to serve the files from here again.
    RewriteEngine On
    RewriteCond %{ENV:CLOUDINARY_CLOUD_NAME} ^([A-Za-z0-9_-]+)$
    RewriteRule "^/frontend/shared/((?:image|icon)/[^ ]+)\.(?:jpe?g|png|webp|gif)$" "https://res.cloudinary.com/%1/image/upload/f_auto,q_auto/salon/$1" [R=302,L,E=SALON_CLOUDINARY:1]
    RewriteCond %{ENV:CLOUDINARY_CLOUD_NAME} ^([A-Za-z0-9_-]+)$
    RewriteRule "^/frontend/shared/(video/[^ ]+\.(?:mp4|webm))$" "https://res.cloudinary.com/%1/video/upload/salon/$1" [R=302,L,E=SALON_CLOUDINARY:1]
    Header always set Cache-Control "public, max-age=86400" env=SALON_CLOUDINARY
    Header always set Vercel-CDN-Cache-Control "max-age=31536000" env=SALON_CLOUDINARY
</VirtualHost>

<Directory "${SALON_PUBLIC}">
    Options None
    AllowOverride None
    Require all granted
</Directory>

<Directory "${SALON_APP}">
    Options None
    AllowOverride None
    Require all denied
</Directory>

<DirectoryMatch "^${SALON_APP}/(frontend|function|backend/(account|admin|auth|cashier|customer|public|staff))(/|$)">
    Require all granted
</DirectoryMatch>

# Apache hides this header from PHP by default; Vercel Cron's secret arrives in it.
<Files "runCron.php">
    CGIPassAuth On
</Files>

# From .htaccess: private file types stay blocked even inside an allowed folder.
<FilesMatch "^(?:(?:brevo|paymongo|mail|sms)_credentials\.php(?:\..*)?|\.env.*|\.ht.*|composer\.(?:json|lock)|package(?:-lock)?\.json|skills-lock\.json|.*\.(?:md|sql|log))$">
    Require all denied
</FilesMatch>

# Static files: let Vercel's CDN keep a copy so repeat requests never reach this
# container (every request that does counts against the Active CPU limit).
# Vercel-CDN-Cache-Control is read only by Vercel's CDN and is not sent on to
# browsers. The CDN cache is tied to the deployment, so a new deploy serves the
# new files right away. PHP responses are not matched here and stay uncached.

# Page code: browsers still check for a newer copy on each load (edits show up
# on the next reload), but the CDN answers that check instead of Apache.
<FilesMatch "\.(css|js|html)$">
    Header set Cache-Control "no-cache"
    Header set Vercel-CDN-Cache-Control "max-age=31536000"
</FilesMatch>

# Images, video and fonts rarely change: browsers keep them for a day.
<FilesMatch "\.(jpe?g|png|webp|gif|svg|ico|avif|mp4|webm|woff2?|ttf)$">
    Header set Cache-Control "public, max-age=86400"
    Header set Vercel-CDN-Cache-Control "max-age=31536000"
</FilesMatch>
