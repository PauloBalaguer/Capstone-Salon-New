<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leo Mejillano Salon &amp; Beauty — Verify Your Email</title>
  <link rel="stylesheet" href="../../assets/css/login-base.css" />
  </head>
  <body>
    <div class="page page-stacked">
      <div class="page-dots" aria-hidden="true"></div>

      <div class="top-bar" data-auth-topbar></div>

      <div class="card">
        <span class="card-badge">
          <svg
            viewBox="0 0 24 24"
            width="19"
            height="19"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M3 7l9 6 9-6" />
          </svg>
        </span>

        <span class="card-eyebrow">Almost there</span>
        <h1 class="card-title">Verify your email</h1>
        <p class="card-text">
          We sent a 6-digit code to
          <strong id="target-email">your email</strong>. Enter it below to
          activate your account.
        </p>

        <form id="verify-otp-form" class="form" novalidate>
          <div class="otp-row">
            <input
              type="text"
              class="otp-digit"
              inputmode="numeric"
              maxlength="1"
              autocomplete="one-time-code"
              aria-label="Digit 1"
            />
            <input
              type="text"
              class="otp-digit"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 2"
            />
            <input
              type="text"
              class="otp-digit"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 3"
            />
            <input
              type="text"
              class="otp-digit"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 4"
            />
            <input
              type="text"
              class="otp-digit"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 5"
            />
            <input
              type="text"
              class="otp-digit"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 6"
            />
          </div>

          <button type="submit" class="btn-main">Verify account</button>
        </form>

        <div class="divider" aria-hidden="true">
          <span></span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M12 2C9 7 6 9 6 13a6 6 0 0 0 12 0c0-4-3-6-6-11z" />
          </svg>
          <span></span>
        </div>

        <p class="card-foot">
          Didn't get a code?
          <button type="button" id="resend-btn" class="link-gold">
            Resend code
          </button>
        </p>
        <p class="card-foot">
          Wrong email? <a href="register.html" class="link-gold">Start over</a>
        </p>
      </div>

      <span class="page-note" data-auth-footer></span>
    </div>

    <div class="loading" id="loading" aria-hidden="true">
      <div class="spinner"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="../../scripts/login/common.js?v=2"></script>
    <script src="../../scripts/login/verify-otp.js"></script>
  </body>
</html>
